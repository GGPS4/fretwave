if (!S.learn) S.learn = saved.learn || { done: {}, last: null, open: {} };

const LEVEL_NAMES = ['First steps', 'Beginner', 'Improver', 'Developing', 'Intermediate', 'Fluent'];
const BOX_DAYS = [1, 3, 7, 16, 35, 90];
function addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return dateStr(d); }
function dueReviews() { const r = S.learn.review || {}; const t = today(); return Object.keys(r).filter((id) => lessonById(id) && r[id].due <= t).sort((a, b) => (r[a].due < r[b].due ? -1 : 1)); }
function scheduleReview(id, passed) { S.learn.review = S.learn.review || {}; const cur = S.learn.review[id] || { box: 0 }; const box = passed ? Math.min(BOX_DAYS.length - 1, cur.box + 1) : 0; S.learn.review[id] = { box, due: addDays(BOX_DAYS[box]) }; }
function allLessons() { const out = []; CURRICULUM.forEach((lv, li) => lv.lessons.forEach((ls, i) => out.push({ lv, li, ls, i }))); return out; }
function lessonById(id) { return allLessons().find((x) => x.ls.id === id); }
function levelProgress(lv) { const d = lv.lessons.filter((l) => S.learn.done[l.id]).length; return { done: d, total: lv.lessons.length, pct: d / lv.lessons.length }; }
function nextLesson() { return allLessons().find((x) => !S.learn.done[x.ls.id]) || null; }
function currentLevelIndex() { const n = nextLesson(); return n ? n.li : CURRICULUM.length - 1; }
function pathPct() { const all = allLessons(); return all.filter((x) => S.learn.done[x.ls.id]).length / all.length; }

/* Helpers the lesson scripts use to draw and play on the neck */
const L = {
  timers: [],
  later(ms, fn) { const t = setTimeout(fn, ms); this.timers.push(t); return t; },
  reset() { this.timers.forEach(clearTimeout); this.timers = []; Tech.stop(); Sound.stopAll(); Neck.cancelPending(); Neck.clear(); Neck.handOff(); Sound.droneOff(); },
  cell(s, f) { return { s, f, midi: midiAt(s, f), pc: midiAt(s, f) % 12 }; },
  note(s, f, o = {}) { return Neck.noteMark(s, f, o); },
  label(s, f, label, color, o = {}) { return Neck.mark(s, f, Object.assign({ label, color }, o)); },
  iv(s, f, root, ctx = [], o = {}) { const semi = mod(midiAt(s, f) - root, 12); return Neck.mark(s, f, Object.assign({ label: intervalInfo(semi, ctx)[0], color: intervalColor(semi, ctx), ring: semi === 0, ringColor: '#fff' }, o)); },
  notes(cells, o = {}) { cells.forEach((c, i) => this.note(c.s, c.f, Object.assign({ delay: (o.stagger || 0) * i }, o))); },
  seq(cells, gap = 0.42, o = {}) {
    cells.forEach((c, i) => {
      this.later(i * gap * 1000 + (o.at || 0) * 1000, () => {
        if (o.iv != null) this.iv(c.s, c.f, o.iv, o.ctx || [], { ring: o.ring }); else if (o.label) this.label(c.s, c.f, typeof o.label === 'function' ? o.label(c, i) : o.label, o.color || noteColor(midiAt(c.s, c.f) % 12)); else this.note(c.s, c.f, { ring: o.ring });
        Neck.play(c.s, c.f, 0, 0.5);
      });
    });
    return cells.length * gap;
  },
  all(pc, o = {}, maxF = S.settings.frets) { allCells((m) => m % 12 === pc, maxF).forEach((c) => this.note(c.s, c.f, o)); },
  onString(s, a, b, pred = () => true) { const out = []; for (let f = a; f <= b; f++) { const c = this.cell(s, f); if (pred(c)) out.push(c); } return out; },
  naturals(s, a = 0, b = 12) { return this.onString(s, a, b, (c) => IS_NATURAL[c.pc]); },
  voicing(frets, root, iv, at = 0, o = {}) {
    drawVoicing({ frets }, root, iv, { stagger: true });
    if (S.settings.hand !== false && !o.noHand && frets.filter((f) => f > 0).length) Neck.hand(frets); else Neck.handOff();
    if (!o.silent) strum(frets, { at });
  },
  chord(root, id, at = 0.2, o = {}) {
    const t = chordType(id);
    const v = o.frets ? { frets: o.frets } : (findVoicings(root, t.iv, 12).find((x) => x.base <= (o.maxBase ?? 7)) || findVoicings(root, t.iv, 12)[0]);
    if (!v) return null;
    if (o.clear !== false) Neck.clear();
    this.voicing(v.frets, root, t.iv, at, o);
    return v;
  },
  progression(chords, gap = 1.3, at = 0.2) {
    chords.forEach(([root, id], i) => this.later((at + i * gap) * 1000, () => this.chord(root, id, 0, { maxBase: 5 })));
  },
  link(a, b, label, color) { Neck.link(a, b, label, color); },
  band(s, color = '#ffc857') { const y = Neck.y(s); Neck.rect(Neck.g.nutX - 92, Neck.g.endX - Neck.g.nutX + 100, { y: y - 16, height: 32, rx: 16, fill: color, opacity: 0.16 }, Neck.fxBelow); },
  shade(range) { Neck.shade(range, strings().map(() => true)); },
  play(midis, gap = 0.4, at = 0) { midis.forEach((m, i) => Sound.play(m, at + i * gap, 0.5)); return midis.length * gap; },
  together(midis, at = 0) { midis.forEach((m, i) => Sound.play(m, at + i * 0.012, 0.42)); },
  scale(root, ivs, [a, b] = [0, 12], o = {}) {
    const pcs = ivs.map((i) => mod(root + i, 12));
    allCells((m, s, f) => f >= a && f <= b && pcs.includes(m % 12)).forEach(({ s, f }) => {
      if (o.names) this.note(s, f, { cls: o.cls || '' }); else this.iv(s, f, root, ivs, { cls: o.cls || '' });
    });
  },
  shape(cells, root, ivs, o = {}) { cells.forEach((c, i) => this.iv(c.s, c.f, root, ivs, { delay: (o.stagger ?? 25) * i, cls: o.cls || '' })); },
  scroll(f) { Neck.scrollTo(f); },
};

/* Pentatonic / scale shapes reused by lessons (standard tuning) */
function boxCells(root, ivs, a, b) {
  const pcs = ivs.map((i) => mod(root + i, 12));
  return allCells((m, s, f) => f >= a && f <= b && pcs.includes(m % 12)).sort((x, y) => x.midi - y.midi);
}
function pentShape(root, n) {
  // n = 1..5, built with the same per-string rule as the Scales page
  const save = Scales.root, saveS = Scales.scale;
  Scales.root = root; Scales.scale = 'minpent';
  const shapes = Scales.positions();
  Scales.root = save; Scales.scale = saveS;
  // shape 1 = the one whose low-E root is the minor root
  const idx = shapes.findIndex((sh) => mod(strings()[0] + sh.anchor, 12) === root);
  const sh = shapes[(idx + n - 1) % shapes.length];
  let cells = sh.cells;
  if (cells.length && Math.min(...cells.map((c) => c.f)) === 0 && n > 1 && cells.every((c) => c.f + 12 <= S.settings.frets)) cells = cells.map((c) => ({ s: c.s, f: c.f + 12, midi: c.midi + 12 }));
  return cells.map((c) => ({ s: c.s, f: c.f, midi: midiAt(c.s, c.f), pc: midiAt(c.s, c.f) % 12 }));
}

/* ---------- Lesson player ---------- */
const Player = {
  active: false,
  open(steps, opts) {
    this.steps = steps; this.opts = opts; this.i = 0; this.mistakes = 0; this.passed = new Set(); this.stepMiss = [];
    this.active = true; this.saveInst = null;
    const st = S.settings;
    if (st.instrument !== 'guitar' || st.tuning !== 'standard' || st.frets < 15) {
      this.saveInst = { instrument: st.instrument, tuning: st.tuning, frets: st.frets };
      st.instrument = 'guitar'; st.tuning = 'standard'; st.frets = Math.max(15, st.frets); Sound.cache.clear();
      Neck.build();
    }
    setStage(true);
    Neck.onCell = (s, f) => this.onCell(s, f);
    this.render();
  },
  close(done) {
    L.reset(); this.active = false; if (Mic.active) Mic.stop();
    if (this.saveInst) { Object.assign(S.settings, this.saveInst); this.saveInst = null; Sound.cache.clear(); Neck.build(); }
    if (speechSynthesis && speechSynthesis.cancel) try { speechSynthesis.cancel(); } catch (e) { /* none */ }
    $('#hud').innerHTML = '';
    if (!done) Path.show();
  },
  step() { return this.steps[this.i]; },
  hasCheck(st = this.step()) { return !!st.check; },
  render() {
    const st = this.step(), n = this.steps.length, p = $('#panel');
    this.check = null;
    $('#hud').innerHTML = `<div class="lesson-hud">
      <button class="icon-btn" id="lp-close" aria-label="Leave lesson" title="Leave lesson">${ICONS.close}</button>
      <div class="lesson-title"><small>${esc(this.opts.kicker || '')}</small><b>${esc(this.opts.title)}</b></div>
      <div class="lp-dots" aria-label="Step ${this.i + 1} of ${n}">${this.steps.map((s, k) => `<i class="${k < this.i ? 'done' : k === this.i ? 'now' : ''}${s.check ? ' chk' : ''}"></i>`).join('')}</div>
      <button class="icon-btn" id="lp-narr" aria-pressed="${S.settings.narrate !== false}" title="Read steps aloud" aria-label="Read steps aloud">${ICONS.voice}</button>
    </div>`;
    $('#lp-close').addEventListener('click', () => this.close());
    $('#lp-narr').addEventListener('click', (e) => { S.settings.narrate = S.settings.narrate === false; persist(); e.currentTarget.setAttribute('aria-pressed', S.settings.narrate !== false); if (S.settings.narrate === false) try { speechSynthesis.cancel(); } catch (x) { /* */ } });
    p.innerHTML = `<div class="lesson-card">
      <p class="lesson-text">${st.t}</p>
      ${st.html ? `<div class="lesson-extra">${typeof st.html === 'function' ? st.html() : st.html}</div>` : ''}
      <div class="lesson-check" id="lp-check"></div>
      <div class="lesson-nav">
        <button class="btn" id="lp-back" ${this.i === 0 ? 'disabled' : ''}>Back</button>
        <button class="btn" id="lp-replay">${ICONS.replay}Show me again</button>
        <span class="lesson-spacer"></span>
        ${st.check ? `<button class="btn btn-quiet" id="lp-skip">Skip this check</button>` : ''}
        <button class="btn btn-primary" id="lp-next" ${st.check && !this.passed.has(this.i) ? 'disabled' : ''}>${this.i === n - 1 ? 'Finish' : 'Next'}</button>
      </div></div>`;
    $('#lp-back').addEventListener('click', () => this.go(this.i - 1));
    $('#lp-next').addEventListener('click', () => this.next());
    $('#lp-replay').addEventListener('click', () => this.show(true));
    const sk = $('#lp-skip'); if (sk) sk.addEventListener('click', () => { this.mistakes += 2; this.stepMiss[this.i] = (this.stepMiss[this.i] || 0) + 2; this.passed.add(this.i); this.next(); });
    $$('[data-goto]', p).forEach((b) => b.addEventListener('click', () => { this.close(true); setMode(b.dataset.goto); }));
    this.show(false);

  },
  show(again) {
    const st = this.step(); L.reset();
    if (st.show) st.show(L);
    if (Checks.cur && Checks.cur.redraw) Checks.cur.redraw();
    if (S.settings.narrate !== false) { const txt = st.t.replace(/<[^>]+>/g, '').replace(/♯/g, ' sharp').replace(/♭/g, ' flat').replace(/°/g, ' diminished'); Voice.sayLong(txt); }
  },
  go(i) { if (i < 0 || i >= this.steps.length) return; Checks.stop(); this.i = i; this.render(); },
  next() { if (this.i < this.steps.length - 1) this.go(this.i + 1); else this.finish(); },

    </div>`;

    $('#dn-path').addEventListener('click', back);
    const nb = $('#dn-next'); if (nb) nb.addEventListener('click', () => { this.close(true); Path.startLesson(nx.ls.id); });

/* ---------- Checks (interactive questions inside lessons) ---------- */
const Checks = {
  cur: null,
  stop() { if (this.cur && this.cur.stop) this.cur.stop(); this.cur = null; if (Mic.active) Mic.stop(); },
  start(spec, box, pass) {
    this.stop();
    const items = spec.items ? spec.items.slice() : spec.gen ? Array.from({ length: spec.n || 3 }, () => spec.gen()) : [spec];
    const kind = spec.type;
    const run = { idx: 0, items, kind, box, spec };
    const fail = () => { Player.mistakes++; Player.stepMiss[Player.i] = (Player.stepMiss[Player.i] || 0) + 1; };
    const advance = () => {
      run.idx++;
      if (run.idx >= items.length) { box.innerHTML = `<div class="check-ok">${ICONS.check}<span>${esc(spec.doneText || 'Nice. Check passed.')}</span></div>`; this.cur = null; Neck.onCell = (s, f) => Player.onCell(s, f); pass(); return; }
      L.later(spec.type === 'quiz' ? 0 : 650, () => renderItem());
    };
    const counter = () => items.length > 1 ? `<span class="check-count">${run.idx + 1} of ${items.length}</span>` : '';
    const renderItem = () => {
      const it = items[run.idx];
      const T = CheckTypes[kind];
      this.cur = T(it, { box, counter, fail, done: advance, spec });
    };
    renderItem();
  },
};
const CheckTypes = {
  tap(it, k) {
    const targets = allCells((m, s, f) => it.target(s, f, m));
    const found = new Set(); let tries = 0;
    const draw = () => { if (it.show) it.show(L); };
    L.reset(); draw();
    k.box.innerHTML = `<div class="check-q">${ICONS.find}<div><b>${it.prompt}</b>${k.counter()}<small>${it.all ? `Find all ${targets.length}.` : 'Tap it on the neck.'}</small></div></div>`;
    return {
      redraw: draw,
      onCell(s, f) {
        const m = midiAt(s, f);
        Neck.play(s, f);
        if (it.target(s, f, m)) {
          found.add(s + ':' + f); Neck.noteMark(s, f, { ring: true, cls: 'pulse' });
          if (!it.all || found.size >= targets.length) { this.onCell = null; k.done(); }
        } else {
          tries++; k.fail(); Neck.flashBad(s, f, noteName(m % 12));
          if (tries >= 2) { targets.forEach((c) => Neck.noteMark(c.s, c.f, { ring: true, cls: 'pulse target' })); this.onCell = null; L.later(1500, () => k.done()); }
        }
      },
    };
  },
  quiz(it, k) {
    k.box.innerHTML = `<div class="check-q">${ICONS.name}<div><b>${it.q}</b>${k.counter()}</div></div>
      <div class="answers quiz">${it.options.map((o, i) => `<button class="answer" data-i="${i}"><b>${o}</b></button>`).join('')}</div><p class="check-why" hidden></p>`;
    let missed = false;
    $$('.answer', k.box).forEach((b) => b.addEventListener('click', () => {
      const i = +b.dataset.i;
      if (i === it.answer) {
        b.classList.add('right'); $$('.answer', k.box).forEach((x) => (x.disabled = true));
        if (it.why) { const w = $('.check-why', k.box); w.hidden = false; w.textContent = it.why; }
        if (it.after) { L.reset(); it.after(L); }
        L.later(it.why ? 1600 : 700, () => k.done());
      } else { b.classList.add('wrong'); b.disabled = true; if (!missed) k.fail(); missed = true; }
    }));
    return {};
  },
  ear(it, k) {
    k.box.innerHTML = `<div class="check-q">${ICONS.ear}<div><b>${it.q}</b>${k.counter()}<small>Press play, then answer.</small></div></div>
      <div class="wrap"><button class="btn btn-primary" id="ck-play">${ICONS.play}Play</button></div>
      <div class="answers quiz">${it.options.map((o, i) => `<button class="answer" data-i="${i}"><b>${o}</b></button>`).join('')}</div><p class="check-why" hidden></p>`;
    const play = () => { Sound.stopAll(); Neck.cancelPending(); it.play(L); };
    $('#ck-play', k.box).addEventListener('click', play);
    L.later(300, play);
    let missed = false;
    $$('.answer', k.box).forEach((b) => b.addEventListener('click', () => {
      const i = +b.dataset.i;
      if (i === it.answer) {
        b.classList.add('right'); $$('.answer', k.box).forEach((x) => (x.disabled = true));
        if (it.why) { const w = $('.check-why', k.box); w.hidden = false; w.textContent = it.why; }
        if (it.after) { L.reset(); it.after(L); }
        L.later(1500, () => k.done());
      } else { b.classList.add('wrong'); b.disabled = true; if (!missed) k.fail(); missed = true; play(); }
    }));

  },
  drill(it, k) {
    // it: { s, pc, a, b } generated by drillGen
    const pc = it.pc;
    L.reset(); L.band(it.s); L.shade([it.a, it.b]);
    Neck.scrollTo(Math.round((it.a + it.b) / 2));
    k.box.innerHTML = `<div class="check-q">${ICONS.find}<div><b>Find <span class="inline-note" style="background:${noteColor(pc)}">${noteName(pc)}</span> on the ${ordinal(stringNumber(it.s))} string</b>${k.counter()}<small>Frets ${it.a} to ${it.b}.</small></div></div>`;
    Sound.play(strings()[it.s] + it.f, 0.05);
    let tries = 0;
    return {
      redraw() { L.band(it.s); L.shade([it.a, it.b]); },
      onCell(s, f) {
        const m = midiAt(s, f); Neck.play(s, f);
        if (s === it.s && m % 12 === pc && f >= it.a && f <= it.b) { recordAnswer(s, f, tries === 0, 3000); Neck.noteMark(s, f, { ring: true, cls: 'pulse' }); this.onCell = null; k.done(); }
        else {
          tries++; k.fail(); Neck.flashBad(s, f, noteName(m % 12));
          if (tries >= 2) { recordAnswer(it.s, it.f, false, 0); Neck.noteMark(it.s, it.f, { ring: true, cls: 'pulse target' }); this.onCell = null; L.later(1400, () => k.done()); }

  seq(it, k) {

    const dots = () => `<div class="seq-dots">${cells.map((c, i) => `<i class="${i < pos ? 'done' : i === pos ? 'now' : ''}" style="${i < pos ? `background:${noteColor(midiAt(c.s, c.f) % 12)}` : ''}"></i>`).join('')}</div>`;
    const paint = () => {
      k.box.innerHTML = `<div class="check-q">${ICONS.play}<div><b>${it.prompt}</b>${k.counter()}<small>${micOn ? 'Listening: play each note on your guitar.' : 'Tap each note in order, or play them on your guitar.'}</small></div></div>${dots()}
      <div class="wrap"><button class="btn" id="sq-hear">${ICONS.replay}Hear it</button><button class="btn" id="sq-mic">${ICONS.mic}${micOn ? 'Stop listening' : 'Use my guitar'}</button></div>`;
      $('#sq-hear', k.box).addEventListener('click', () => { Sound.stopAll(); cells.forEach((c, i) => Neck.play(c.s, c.f, i * 0.32, 0.45)); });
      $('#sq-mic', k.box).addEventListener('click', async () => {

      stop() { if (Mic.active) Mic.stop(); },

  chord(it, k) {

        <p class="check-why" id="ck-msg">${res || ''}</p>
        <div class="wrap"><button class="btn btn-primary" id="ck-mic">${ICONS.mic}${micOn ? 'Stop listening' : 'Listen to my guitar'}</button><button class="btn" id="ck-hear">${ICONS.strum}Hear it</button><button class="btn" id="ck-self">I played it cleanly</button></div>`;
      $('#ck-hear', k.box).addEventListener('click', () => strum(v.frets));
      $('#ck-self', k.box).addEventListener('click', () => finish());
      $('#ck-mic', k.box).addEventListener('click', async () => {
        if (micOn) { Mic.stop(); micOn = false; paint(); return; }

      });

      if (!c) { good = Math.max(0, good - 1); return; }
      const r = checkChord(c, pcs);
      if (r.ok) { good++; if (good >= 4) finish(true); }

        good = 0;

};
// generators used by the curriculum
function drillGen(stringsList, a, b, naturals = true) {
  return () => {
    const s = rand(stringsList);
    let f; do { f = a + Math.floor(Math.random() * (b - a + 1)); } while (naturals && !IS_NATURAL[midiAt(s, f) % 12]);
    return { s, f, pc: midiAt(s, f) % 12, a, b };
  };
}
function celebrate() {
  if (reduceMotion()) return;
  const cells = allCells((m, s, f) => f > 0 && f <= 12).sort(() => Math.random() - 0.5).slice(0, 18);
  cells.forEach((c, i) => setTimeout(() => { Neck.pluck(c.s, c.f, noteGlow(c.pc)); }, i * 45));
  [0, 4, 7, 12].forEach((iv, i) => Sound.play(60 + iv, 0.05 + i * 0.09, 0.35));
}

    wirePrintables(p);
    $$('.g-lessons .chip', p).forEach((b) => b.addEventListener('click', () => { setMode('path'); Path.startLesson(b.dataset.id); }));
    if (this.focus != null) { const el = $(`#gd-${this.focus}`); if (el) setTimeout(() => el.scrollIntoView({ block: 'start' }), 50); this.focus = null; }
  },
};

   Lessons are written for standard-tuned guitar; the player switches to it while a lesson runs.
   String index: 0 = low E (6th string) ... 5 = high e (1st string). */
const at = (s, f) => ({ s, f });
const run = (s, frets) => frets.map((f) => at(s, f));
const MAJ = [0, 2, 4, 5, 7, 9, 11], MINPENT = [0, 3, 5, 7, 10], BLUES = [0, 3, 5, 6, 7, 10];
function voicingOf(root, id) { const t = chordType(id); return (findVoicings(root, t.iv, 12).find((v) => v.base <= 5) || findVoicings(root, t.iv, 12)[0]); }
function hearChords(list, gap = 1.1) {
  const ctx = Sound.ensure(); if (!ctx) return;
  list.forEach(([r, id], i) => { const v = voicingOf(r, id); if (v) Sound.strumAt(v.frets, ctx.currentTime + 0.1 + i * gap, false, 0.32); });
}
function randRoot(lo = 0, hi = 11) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }
function shuffleOpts(opts, answer) { const o = opts.map((t, i) => ({ t, ok: i === answer })).sort(() => Math.random() - 0.5); return { options: o.map((x) => x.t), answer: o.findIndex((x) => x.ok) }; }
function circleSVG() {
  const keys = ['C', 'G', 'D', 'A', 'E', 'B', 'F♯', 'D♭', 'A♭', 'E♭', 'B♭', 'F'], acc = ['0', '1♯', '2♯', '3♯', '4♯', '5♯', '6♯', '5♭', '4♭', '3♭', '2♭', '1♭'];
  const pcs = [0, 7, 2, 9, 4, 11, 6, 1, 8, 3, 10, 5];
  return `<svg class="circle5" viewBox="0 0 260 260" role="img" aria-label="Circle of fifths">${keys.map((k, i) => { const a = (i / 12) * Math.PI * 2 - Math.PI / 2, x = 130 + Math.cos(a) * 100, y = 130 + Math.sin(a) * 100; return `<g><circle cx="${x}" cy="${y}" r="21" fill="${noteColor(pcs[i])}"/><text x="${x}" y="${y + 1}" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="800" fill="#1d1a3b">${k}</text><text x="${130 + Math.cos(a) * 58}" y="${130 + Math.sin(a) * 58}" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#b8b1cc">${acc[i]}</text></g>`; }).join('')}<text x="130" y="130" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#b8b1cc">clockwise = up a 5th</text></svg>`;
}

/* ================= CAGED map ================= */
const CAGED_SHAPES = [
  { name: 'C', rootStr: 1, off: [null, 0, -1, -3, -2, -3], color: '#ff7b54' },
  { name: 'A', rootStr: 1, off: [null, 0, 2, 2, 2, 0], color: '#ffd166' },
  { name: 'G', rootStr: 0, off: [0, -1, -3, -3, -3, 0], color: '#8be0a4' },
  { name: 'E', rootStr: 0, off: [0, 2, 2, 1, 0, 0], color: '#5aa9ff' },
  { name: 'D', rootStr: 2, off: [null, null, 0, 2, 3, 2], color: '#c69cff' },
];
const isStdGuitar = () => S.settings.instrument === 'guitar' && S.settings.tuning === 'standard';
function cagedShapes(root) {
  const tun = strings();
  return CAGED_SHAPES.map((sh) => {
    const rf = mod(root - tun[sh.rootStr], 12);
    let frets = sh.off.map((o) => (o == null ? null : rf + o));
    if (Math.min(...frets.filter((f) => f != null)) < 0) frets = frets.map((f) => (f == null ? null : f + 12));
    frets = frets.map((f) => (f == null ? -1 : f));
    return Object.assign({}, sh, { frets, lo: Math.min(...frets.filter((f) => f >= 0)), hi: Math.max(...frets) });
  }).sort((a, b) => a.lo - b.lo);
}
Neck.caged = function (root, o = {}) {
  if (!isStdGuitar()) { toast('The CAGED map is drawn for a standard-tuned guitar.'); return []; }
  this.clear();
  const shapes = cagedShapes(root);
  const iv = [0, 4, 7];
  shapes.forEach((sh) => {
    if (o.only && sh.name !== o.only) return;
    if (sh.hi > this.g.F) return;
    const x0 = sh.lo === 0 ? this.g.nutX - 80 : this.g.xs[sh.lo - 1] + 2, x1 = this.g.xs[Math.min(sh.hi, this.g.F)] - 2;
    const used = sh.frets.map((f, s) => (f >= 0 ? s : null)).filter((s) => s != null);
    const yTop = this.y(Math.max(...used)) - 22, yBot = this.y(Math.min(...used)) + 22;
    this.rect(x0, x1 - x0, { y: yTop, height: yBot - yTop, rx: 16, fill: sh.color, opacity: 0.13, stroke: sh.color, 'stroke-width': 2, 'stroke-opacity': 0.6 }, this.fxBelow);
    const t = el('text', { x: this.X((x0 + x1) / 2), y: this.g.boardBot + 12, class: 'caged-label', fill: sh.color, 'text-anchor': 'middle' }, this.fx); t.textContent = sh.name + ' shape';
    sh.frets.forEach((f, s) => {
      if (f < 0) return;
      const semi = mod(midiAt(s, f) - root, 12);
      if (o.rootsOnly && semi !== 0) { this.mark(s, f, { label: intervalInfo(semi, iv)[0], color: intervalColor(semi, iv), cls: 'ghost' }); return; }
      this.mark(s, f, { label: intervalInfo(semi, iv)[0], color: intervalColor(semi, iv), ring: semi === 0, ringColor: '#fff' });
    });
  });
  return shapes;
};

  deferred: null,
  init() {
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); this.deferred = e; const b = $('#ap-install'); if (b) b.disabled = false; });
    try {
      if ('serviceWorker' in navigator && /^https:|^http:\/\/localhost/.test(location.href) && window.top === window.self) {
        navigator.serviceWorker.register('sw.js').then((reg) => { this.reg = reg; }).catch(() => {});
      }
    } catch (e) { /* sandboxed preview */ }
    setInterval(() => this.maybeRemind(), 60000); setTimeout(() => this.maybeRemind(), 4000);
  },
  installed() { return window.matchMedia && matchMedia('(display-mode: standalone)').matches; },
  async install() {
    if (this.deferred) { this.deferred.prompt(); await this.deferred.userChoice; this.deferred = null; return; }
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    toast(ios ? 'On iPhone: tap Share, then “Add to Home Screen”.' : 'Use your browser menu: “Install app” or “Add to Home screen”.', 5000);
  },
  async enableReminder(on) {
    S.settings.reminder = on ? (S.settings.reminder || '19:00') : null; persist();
    if (!on) return;
    if ('Notification' in window && Notification.permission === 'default') { try { await Notification.requestPermission(); } catch (e) { /* ignore */ } }
    try { const reg = this.reg || (navigator.serviceWorker && await navigator.serviceWorker.ready); if (reg && reg.periodicSync) await reg.periodicSync.register('fretwave-reminder', { minInterval: 12 * 3600 * 1000 }); } catch (e) { /* not supported: falls back to in-app and calendar reminders */ }
  },
  maybeRemind() {
    const r = S.settings.reminder; if (!r || S.daily.last === today()) return;
    const [h, m] = r.split(':').map(Number); const now = new Date();
    if (now.getHours() * 60 + now.getMinutes() < h * 60 + m || S.settings.remindedOn === today()) return;
    S.settings.remindedOn = today(); persist();
    const st = currentStreak();
    const body = st ? `Keep your ${st}-day streak going: one quick lesson does it.` : 'Five minutes on the fretboard today?';
    try { if ('Notification' in window && Notification.permission === 'granted') { if (this.reg) this.reg.showNotification('Fretwave', { body, icon: 'icons/icon-192.png', tag: 'fretwave-daily' }); else new Notification('Fretwave', { body }); return; } } catch (e) { /* fall through */ }
    toast(body, 5000);
  },
  calendarFile() {
    const [h, m] = (S.settings.reminder || '19:00').split(':');
    const d = new Date(); const ds = dateStr(d).replace(/-/g, '');
    const url = location.href.split('#')[0];
    const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Fretwave//EN', 'BEGIN:VEVENT', `UID:fretwave-daily-${Date.now()}@fretwave`, `DTSTAMP:${ds}T000000Z`, `DTSTART:${ds}T${h}${m}00`, 'DURATION:PT10M', 'RRULE:FREQ=DAILY', 'SUMMARY:Guitar practice (Fretwave)', `DESCRIPTION:Ten minutes on the fretboard. Open ${url}`, `URL:${url}`, 'BEGIN:VALARM', 'TRIGGER:PT0M', 'ACTION:DISPLAY', 'DESCRIPTION:Time to practice', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })); a.download = 'fretwave-practice.ics'; document.body.appendChild(a); a.click(); a.remove();
  },
};

/* ================= Settings dialog (tabs keep it short) ================= */
let settingsTab = 'instrument';
function openSettings(tab) {
  if (tab) settingsTab = tab;
  const st = S.settings, body = $('#settings-body');
  const tabs = seg('st-tabs', [['instrument', 'Instrument'], ['sound', 'Sound and goals'], ['sync', 'Sync and app']], settingsTab);
  let html = '';
  if (settingsTab === 'instrument') html = `
    <div class="row"><span class="lbl">Instrument</span>${seg('st-inst', Object.entries(INSTRUMENTS).map(([k, v]) => [k, v.name]), st.instrument)}</div>
    <div class="row"><span class="lbl">Tuning</span><select id="st-tun" aria-label="Tuning">${Object.entries(inst().tunings).map(([k, v]) => `<option value="${k}" ${k === st.tuning ? 'selected' : ''}>${v.name}</option>`).join('')}</select></div>
    <div class="row"><span class="lbl">Frets shown</span>${seg('st-frets', [['12', '12'], ['15', '15'], ['19', '19'], ['22', '22'], ['24', '24']], st.frets)}</div>
    <div class="row"><span class="lbl">Accidentals</span>${seg('st-acc', [['sharp', 'Sharps (C♯)'], ['flat', 'Flats (D♭)']], st.accidentals)}</div>
    <div class="row"><span class="lbl">Hand</span>${seg('st-hand', [['0', 'Right-handed'], ['1', 'Left-handed']], st.lefty ? '1' : '0')}</div>
    <p class="muted" style="font-size:13px;margin:0">Lessons always use a standard-tuned guitar; everything else follows these settings.</p>`;
  else if (settingsTab === 'sound') html = `
    <div class="row"><span class="lbl">Volume</span><div class="slider"><input type="range" min="0" max="1" step="0.05" value="${st.volume}" id="st-vol" aria-label="Volume"><output id="st-vol-o">${Math.round(st.volume * 100)}%</output></div></div>
    <div class="row"><span class="lbl">Voice</span><div class="wrap" style="gap:18px"><label class="switch"><input type="checkbox" id="st-speak" ${st.speak ? 'checked' : ''}>Say note names aloud</label><label class="switch"><input type="checkbox" id="st-narr" ${st.narrate !== false ? 'checked' : ''}>Read lessons aloud</label></div></div>
    <div class="row"><span class="lbl">Daily goal</span>${seg('st-goal', [['20', '20 notes'], ['40', '40 notes'], ['80', '80 notes'], ['150', '150 notes']], st.goal)}</div>`;
  else html = `
    <div class="row row-wide"><span class="lbl">Sync across devices</span><div id="sync-status"></div></div>
    <div class="row row-wide"><span class="lbl">Progress code (works without an account)</span>
      <div class="wrap"><button class="btn" id="st-copy">${ICONS.copy}Copy my progress code</button><span class="muted" style="font-size:13px">Paste it on your other device below.</span></div>
      <textarea id="st-code" rows="2" placeholder="Paste a progress code here" aria-label="Progress code"></textarea>
      <div class="wrap"><button class="btn" id="st-import">Add this progress</button></div></div>
    <div class="row row-wide"><span class="lbl">Install as an app</span><div class="wrap"><button class="btn btn-primary" id="ap-install" ${AppShell.installed() ? 'disabled' : ''}>${ICONS.download}${AppShell.installed() ? 'Installed' : 'Install Fretwave'}</button><span class="muted" style="font-size:13px">Works offline once installed.</span></div></div>
    <div class="row row-wide"><span class="lbl">Daily reminder</span><div class="wrap" style="gap:14px"><label class="switch"><input type="checkbox" id="st-rem" ${st.reminder ? 'checked' : ''}>Remind me at</label><input type="time" id="st-remt" value="${st.reminder || '19:00'}" aria-label="Reminder time"><button class="btn" id="st-ics">${ICONS.bell}Add to my calendar instead</button></div>
      <p class="muted" style="font-size:13px;margin:0">Notifications work best with the app installed (Chrome, Edge and Android). The calendar option works on every phone, including iPhone.</p></div>`;
  body.innerHTML = `<div>${tabs}</div>${html}`;
  wireSeg(body, 'st-tabs', (v) => openSettings(v));
  const rebuild = () => { persist(); Neck.build(); remount(); };
  if (settingsTab === 'instrument') {
    wireSeg(body, 'st-inst', (v) => { st.instrument = v; st.tuning = Object.keys(INSTRUMENTS[v].tunings)[0]; st.drill.strings = null; Sound.cache.clear(); $('#st-tun').innerHTML = Object.entries(inst().tunings).map(([k, t]) => `<option value="${k}">${t.name}</option>`).join(''); rebuild(); });
    $('#st-tun').addEventListener('change', (e) => { st.tuning = e.target.value; rebuild(); });
    wireSeg(body, 'st-frets', (v) => { st.frets = +v; rebuild(); });
    wireSeg(body, 'st-acc', (v) => { st.accidentals = v; rebuild(); });
    wireSeg(body, 'st-hand', (v) => { st.lefty = v === '1'; rebuild(); });
  } else if (settingsTab === 'sound') {
    $('#st-vol').addEventListener('input', (e) => { st.volume = +e.target.value; $('#st-vol-o').textContent = Math.round(st.volume * 100) + '%'; Sound.setVolume(st.volume); persist(); });
    $('#st-vol').addEventListener('change', () => Sound.play(57));
    $('#st-speak').addEventListener('change', (e) => { st.speak = e.target.checked; persist(); syncTopButtons(); });
    $('#st-narr').addEventListener('change', (e) => { st.narrate = e.target.checked; persist(); });
    wireSeg(body, 'st-goal', (v) => { st.goal = +v; persist(); renderDaily(); });
  } else {
    renderSyncStatus();
    $('#st-copy').addEventListener('click', async () => { const code = b64e(JSON.stringify(snapshot())); try { await navigator.clipboard.writeText(code); toast('Progress code copied.'); } catch (e) { $('#st-code').value = code; $('#st-code').select(); toast('Copy the code from the box.'); } });
    $('#st-import').addEventListener('click', () => { try { const o = JSON.parse(b64d($('#st-code').value)); if (mergeIn(o)) { persist(); renderDaily(); toast('Progress added. Nothing was overwritten: the best of both is kept.'); $('#st-code').value = ''; } } catch (e) { toast('That code didn’t work. Copy the whole thing and try again.'); } });
    $('#ap-install').addEventListener('click', () => AppShell.install());
    $('#st-rem').addEventListener('change', (e) => AppShell.enableReminder(e.target.checked));
    $('#st-remt').addEventListener('change', (e) => { st.reminder = e.target.value; $('#st-rem').checked = true; persist(); AppShell.enableReminder(true); });
    $('#st-ics').addEventListener('click', () => { if (!st.reminder) st.reminder = $('#st-remt').value; AppShell.calendarFile(); });
  }
  if (!$('#settings').open) $('#settings').showModal();
}

/* ================= App shell: four sections, each with a few sub-pages ================= */
const GROUPS = [
  { id: 'learn', name: 'Learn', icon: 'learn', modes: ['path', 'theory', 'progress'], hint: 'Lessons and your roadmap' },
  { id: 'practice', name: 'Practice', icon: 'find', modes: ['find', 'name', 'ear'], hint: 'Quick drills' },
  { id: 'play', name: 'Play', icon: 'jam', modes: ['jam', 'tabs', 'live', 'check'], hint: 'Play your real guitar' },
  { id: 'tools', name: 'Tools', icon: 'tools', modes: ['explore', 'chords', 'scales', 'analyzer', 'circle', 'tunings', 'tuner'], hint: 'Reference, tunings and tuner' },
];
const MODES = [Path, Theory, Progress, Find, NameIt, Ear, Jam, Tabs, Live, Check, Explore, Chords, Scales, Analyzer, Circle, Tunings, Tuner];
const SUB_LABELS = { path: 'Path', theory: 'Theory notes', progress: 'Progress', find: 'Find it', name: 'Name it', ear: 'Ear training', jam: 'Jam room', tabs: 'Tab player', live: 'Live view', check: 'Chord check', explore: 'Neck', chords: 'Chords', scales: 'Scales', analyzer: 'Analyzer', circle: 'Circle of fifths', tunings: 'Tunings', tuner: 'Tuner' };
let current = null;
const groupOf = (id) => GROUPS.find((g) => g.modes.includes(id)) || GROUPS[0];
function setStage(on) { $('#stage').hidden = !on; }
function setMode(id) {
  const m = MODES.find((x) => x.id === id) || Path;
  if (current && current.unmount) current.unmount();
  Sound.stopAll(); Neck.cancelPending(); Checks.stop(); Tech.stop(); Neck.handOff();
  current = m; S.mode = m.id; S.settings.lastMode = m.id;
  const g = groupOf(m.id); S.settings.lastIn = S.settings.lastIn || {}; S.settings.lastIn[g.id] = m.id; persist();
  $$('#nav .nav-btn').forEach((b) => b.setAttribute('aria-current', b.dataset.g === g.id ? 'page' : 'false'));
  $('#subtabs').innerHTML = g.modes.map((mid) => `<button type="button" role="tab" class="subtab" data-m="${mid}" aria-selected="${mid === m.id}">${SUB_LABELS[mid]}</button>`).join('');
  $('#mode-title').textContent = m.title; $('#mode-help').textContent = m.help;
  $('#hud').innerHTML = ''; Why.hide();
  setStage(!m.noNeck);
  Neck.clear(); Neck.onCell = (s, f, e) => (m.onCell ? m.onCell(s, f, e) : Neck.play(s, f));
  m.mount($('#panel'));
  document.title = `${SUB_LABELS[m.id]}: Fretwave`;
  window.scrollTo({ top: 0 });
}
function remount() { setMode(S.mode); }
function renderDaily() {
  const goal = S.settings.goal, count = S.daily.date === today() ? S.daily.count : 0;
  const C = 2 * Math.PI * 26, pct = Math.min(1, count / goal);
  $('#daily').innerHTML = `<svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="26" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="5"/><circle cx="30" cy="30" r="26" fill="none" stroke="${pct >= 1 ? '#5ee6a8' : '#ffc857'}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}" style="transition:stroke-dashoffset .5s"/></svg><div class="daily-inner"><b>${count}</b><small>of ${goal}</small></div>`;
  $('#daily').title = `${count} of ${goal} notes practiced today`;
  const st = currentStreak();
  $('#streak').innerHTML = st ? `${ICONS.flame}${st} day${st === 1 ? '' : 's'}` : '<span class="muted" style="font-size:11px">No streak yet</span>';
  const lv = $('#rail-level');
  if (lv) { const li = currentLevelIndex(); const pr = levelProgress(CURRICULUM[li]); lv.innerHTML = `<small>Level ${li + 1}</small><span class="rl-bar"><i style="width:${Math.round(pr.pct * 100)}%"></i></span>`; lv.title = `Level ${li + 1}: ${CURRICULUM[li].title}, ${pr.done} of ${pr.total} lessons`; }
}
function syncTopButtons() {
  $('#btn-sound').setAttribute('aria-pressed', S.settings.sound);
  $('#btn-voice').setAttribute('aria-pressed', S.settings.speak);
}
function init() {
  $('#nav').innerHTML = GROUPS.map((g) => `<button type="button" class="nav-btn" data-g="${g.id}" title="${g.hint}">${ICONS[g.icon]}<span>${g.name}</span></button>`).join('');
  $('#nav').addEventListener('click', (e) => { const b = e.target.closest('.nav-btn'); if (!b) return; const g = GROUPS.find((x) => x.id === b.dataset.g); setMode((S.settings.lastIn || {})[g.id] || g.modes[0]); });
  $('#subtabs').addEventListener('click', (e) => { const b = e.target.closest('.subtab'); if (b) setMode(b.dataset.m); });
  $('#rail-level').addEventListener('click', () => setMode('path'));
  $('#btn-sound').innerHTML = ICONS.sound; $('#btn-voice').innerHTML = ICONS.voice; $('#btn-settings').innerHTML = ICONS.settings;
  $('#btn-sound').addEventListener('click', () => { S.settings.sound = !S.settings.sound; persist(); syncTopButtons(); if (S.settings.sound) Sound.play(57); else { Sound.stopAll(); Metro.stop(); } toast(S.settings.sound ? 'Sound on' : 'Sound off', 1000); });
  $('#btn-voice').addEventListener('click', () => { S.settings.speak = !S.settings.speak; persist(); syncTopButtons(); if (S.settings.speak) Voice.say('Note names on'); toast(S.settings.speak ? 'Note names will be spoken' : 'Spoken note names off', 1200); });
  $('#btn-settings').addEventListener('click', () => openSettings());
  $('#btn-why').innerHTML = '<span class="why-q">?</span><span class="why-t">Why?</span>'; $('#btn-why').addEventListener('click', () => Why.toggle());
  $('#settings-done').addEventListener('click', () => $('#settings').close());
  document.addEventListener('keydown', (e) => {
    if ($('#settings').open || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.closest('input, select, textarea')) return;
    if (e.code === 'Space' && e.target.closest('button')) return;
    if (current && current.onKey) current.onKey(e);
  });
  document.addEventListener('pointerdown', () => Sound.ensure(), { once: true });
  syncTopButtons(); initMetro();
  Neck.init($('#neck'));
  renderDaily();
  AppShell.init();
  if (Sync.cfg()) Sync.init();
  const first = S.settings.lastMode && MODES.some((m) => m.id === S.settings.lastMode) ? S.settings.lastMode : 'path';
  setMode(first);
}
init();
</script>
</body>
</html>
