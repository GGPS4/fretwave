<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fretwave: see it, hear it, learn the fretboard</title>
<meta name="description" content="Learn every note on the guitar fretboard with color, sound and play. Note games, chords, scales, ear training and a tuner, free in your browser.">
<meta name="theme-color" content="#1d1a3b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">

<link rel="manifest" href="manifest.webmanifest">

<style>:root {
  --velvet: #1d1a3b;
  --velvet-2: #26234d;
  --velvet-3: #322e61;
  --velvet-4: #403b78;
  --line: rgba(241, 233, 218, 0.12);
  --pearl: #f1e9da;
  --pearl-dim: #b8b1cc;
  --amber: #ffc857;
  --amber-deep: #e9a92a;
  --good: #5ee6a8;
  --bad: #ff6b7a;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 26px;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background:
    radial-gradient(1100px 520px at 58% -120px, #3d3678 0%, rgba(61, 54, 120, 0) 70%),
    radial-gradient(800px 400px at 100% 100%, #2a2554 0%, rgba(42, 37, 84, 0) 70%),
    var(--velvet);
  color: var(--pearl);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; border-radius: 8px; }

/* ---------- App shell ---------- */
.app {
  display: grid;
  grid-template-columns: 92px 1fr;
  min-height: 100vh;
}
.rail {
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  gap: 4px; padding: 18px 8px;
  border-right: 1px solid var(--line);
  background: rgba(20, 18, 44, 0.45);
}
.logo { display: grid; place-items: center; width: 52px; height: 52px; margin-bottom: 14px; }
.logo svg { width: 46px; height: 46px; }
.nav-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  width: 76px; padding: 9px 4px 8px;
  background: none; border: 0; border-radius: 14px;
  color: var(--pearl-dim); cursor: pointer;
  font-size: 12px; line-height: 1.15;
  transition: background .15s, color .15s;
}
.nav-btn svg { width: 26px; height: 26px; }
.nav-btn:hover { background: rgba(255,255,255,.05); color: var(--pearl); }
.nav-btn[aria-current="page"] { background: var(--velvet-3); color: var(--amber); }
#nav { display: flex; flex-direction: column; gap: 4px; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.daily { display: grid; place-items: center; position: relative; width: 60px; height: 60px; }
.daily svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.daily b { font-family: var(--display); font-size: 17px; line-height: 1; }
.daily small { font-size: 10px; color: var(--pearl-dim); }
.daily-inner { display: flex; flex-direction: column; align-items: center; }
.streak { display: flex; align-items: center; gap: 3px; font-size: 13px; color: var(--amber); }
.streak svg { width: 14px; height: 14px; }

main { min-width: 0; padding: 18px 28px 40px; }
.topbar { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 10px; }
.topbar h1 {
  font-family: var(--display); font-weight: 700; letter-spacing: -0.02em;
  font-size: clamp(28px, 3.4vw, 42px); line-height: 1.05; margin: 0;
}
.topbar p { margin: 6px 0 0; color: var(--pearl-dim); max-width: 62ch; }
.top-actions { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }
.icon-btn {
  width: 44px; height: 44px; display: grid; place-items: center;
  border-radius: 50%; border: 1px solid var(--line); background: var(--velvet-2);
  cursor: pointer; color: var(--pearl);
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn[aria-pressed="false"] { color: var(--pearl-dim); opacity: .6; }
.icon-btn:hover { border-color: rgba(241,233,218,.3); }

/* ---------- Stage + neck ---------- */
.stage { position: relative; margin: 6px -28px 0; padding: 0 28px; }
.hud {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  min-height: 72px; padding: 6px 0 10px;
}
.hud:empty { min-height: 12px; padding: 0; }
.prompt {
  display: flex; align-items: center; gap: 14px;
  font-family: var(--display); font-size: clamp(22px, 2.6vw, 32px); font-weight: 600; letter-spacing: -0.01em;
}
.note-pill {
  display: inline-grid; place-items: center; min-width: 64px; height: 64px; padding: 0 14px;
  border-radius: 999px; color: var(--velvet); font-weight: 800; font-size: 34px;
  box-shadow: 0 0 0 4px rgba(255,255,255,.08), 0 0 34px -4px var(--glow, transparent);
  animation: pillIn .35s cubic-bezier(.2,.9,.3,1.3);
}
@keyframes pillIn { from { transform: scale(.6); opacity: 0; } }
.hud-stats { margin-left: auto; display: flex; gap: 22px; align-items: center; }
.hud-stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
.hud-stat b { font-family: var(--display); font-size: 26px; }
.hud-stat span { font-size: 12px; color: var(--pearl-dim); }
.hud-stat.hot b { color: var(--amber); }
.round-bar { position: absolute; left: 28px; right: 28px; bottom: -4px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.07); overflow: hidden; }
.round-bar i { display: block; height: 100%; background: var(--amber); transition: width .3s; }
.hearing { font-size: 15px; color: var(--pearl-dim); display: flex; gap: 8px; align-items: center; }
.hearing b { font-family: var(--display); font-size: 22px; color: var(--pearl); }

.neck-scroll {
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: thin; scrollbar-color: var(--velvet-4) transparent;
  padding-bottom: 6px;
}
.neck-wrap { position: relative; min-width: 900px; }
.neck-wrap::after {
  content: ""; position: absolute; left: 6%; right: 6%; bottom: 10px; height: 40px; z-index: -1;
  background: radial-gradient(closest-side, rgba(0,0,0,.55), transparent); filter: blur(8px);
}
#neck { display: block; width: 100%; height: auto; user-select: none; touch-action: manipulation; }
#neck .hit { fill: transparent; cursor: pointer; }
#neck .hit:hover { fill: rgba(255, 240, 210, 0.07); }
#neck text { font-family: var(--display); }
.fretnum { fill: rgba(241,233,218,.35); font-size: 15px; font-weight: 600; text-anchor: middle; }
.fretnum.dot { fill: rgba(241,233,218,.75); }
.strname { fill: var(--pearl-dim); font-size: 16px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }

.mk { pointer-events: none; }
.mk .in { transform-box: fill-box; transform-origin: center; animation: mkIn .28s cubic-bezier(.2,.9,.3,1.4) both; }
.mk text { font-weight: 800; text-anchor: middle; dominant-baseline: central; fill: #1d1a3b; }
.mk.ghost .in { opacity: .28; }
.mk.dim .in { opacity: .5; }
.mk.small circle.body { transform: scale(.45); transform-box: fill-box; transform-origin: center; }
.mk .ring { fill: none; stroke-width: 3; transform-box: fill-box; transform-origin: center; }
.mk.pulse .ring { animation: ringPulse 1.3s ease-out infinite; }
.mk.target .in { animation: mkIn .28s cubic-bezier(.2,.9,.3,1.4) both, bob 1.6s ease-in-out .3s infinite; }
.mk.bad .in { animation: shake .4s ease both; }
.mk.fade { transition: opacity .6s; opacity: 0; }
.mk.muted text { fill: var(--pearl-dim); font-size: 20px; }
@keyframes mkIn { from { transform: scale(.2); opacity: 0; } }
@keyframes ringPulse { 0% { transform: scale(.9); opacity: .95; } 100% { transform: scale(1.6); opacity: 0; } }
@keyframes bob { 50% { transform: scale(1.1); } }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.ripple { transform-box: fill-box; transform-origin: center; animation: ripple .7s ease-out forwards; pointer-events: none; }
@keyframes ripple { from { transform: scale(1); opacity: .9; } to { transform: scale(2.8); opacity: 0; } }
.str.twang { transform-box: fill-box; transform-origin: center; animation: twang .75s linear; }
@keyframes twang {
  0% { transform: translateY(0); } 8% { transform: translateY(2.6px); } 16% { transform: translateY(-2.4px); }
  24% { transform: translateY(2px); } 32% { transform: translateY(-1.7px); } 42% { transform: translateY(1.3px); }
  54% { transform: translateY(-1px); } 68% { transform: translateY(.6px); } 84% { transform: translateY(-.3px); } 100% { transform: translateY(0); }
}
.str.glow rect.core { filter: url(#strGlow); }
.link-line { stroke-width: 4; stroke-linecap: round; stroke-dasharray: 2 9; fill: none; animation: dash 1s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -22; } }
.link-label { font-size: 18px; font-weight: 800; text-anchor: middle; fill: var(--pearl); paint-order: stroke; stroke: var(--velvet); stroke-width: 5px; }
.heat-label { font-size: 11px !important; }

.rotate-hint { display: none; font-size: 13px; color: var(--pearl-dim); margin: 2px 0 0; }

/* ---------- Panel + controls ---------- */
.panel { margin-top: 22px; display: grid; gap: 18px; }
.panel-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 26px; align-items: start; }
.controls { display: grid; gap: 14px; }
.row { display: grid; grid-template-columns: 110px 1fr; gap: 12px; align-items: center; }
.row > .lbl { color: var(--pearl-dim); font-size: 14px; }
.row-wide { grid-template-columns: 1fr; }
.wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(0,0,0,.22); border: 1px solid var(--line); }
.seg button {
  border: 0; background: none; padding: 8px 14px; border-radius: 10px; cursor: pointer;
  color: var(--pearl-dim); font-size: 15px; white-space: nowrap;
}
.seg button:hover { color: var(--pearl); }
.seg button[aria-pressed="true"] { background: var(--velvet-4); color: var(--pearl); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--velvet-2); color: var(--pearl-dim);
  padding: 7px 13px; border-radius: 999px; cursor: pointer; font-size: 15px;
}
.chip[aria-pressed="true"] { color: var(--pearl); border-color: rgba(241,233,218,.45); background: var(--velvet-4); }
.chip .sw { width: 10px; height: 10px; border-radius: 50%; }

.note-chip {
  width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer;
  font-family: var(--display); font-weight: 800; font-size: 16px; color: var(--velvet);
  background: var(--c); box-shadow: inset 0 -3px 0 rgba(0,0,0,.18);
  transition: transform .12s;
}
.note-chip:hover { transform: translateY(-2px); }
.note-chip:active { transform: scale(.94); }
.note-chip[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--velvet), 0 0 0 6px var(--c), 0 0 22px var(--c); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--velvet-3); color: var(--pearl);
  padding: 11px 18px; border-radius: 14px; cursor: pointer; font-size: 15px; font-weight: 700;
}
.btn:hover { background: var(--velvet-4); }
.btn svg { width: 18px; height: 18px; }
.btn-primary { background: var(--amber); color: #2a1f05; border-color: transparent; box-shadow: 0 8px 28px -10px var(--amber); }
.btn-primary:hover { background: #ffd47a; }
.btn-big { padding: 15px 26px; font-size: 18px; border-radius: 18px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; color: var(--pearl); font-size: 15px; }
.switch input { appearance: none; width: 44px; height: 26px; border-radius: 99px; background: var(--velvet-4); position: relative; cursor: pointer; margin: 0; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--pearl); transition: transform .18s; }
.switch input:checked { background: var(--amber-deep); }
.switch input:checked::after { transform: translateX(18px); }

.slider { display: flex; align-items: center; gap: 12px; }
.slider input { flex: 1; accent-color: var(--amber); max-width: 260px; }
.slider output { font-family: var(--display); font-weight: 700; min-width: 70px; }

.surface { background: var(--velvet-2); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px; }
.muted { color: var(--pearl-dim); }
.empty { color: var(--pearl-dim); font-size: 15px; }

/* Explore info */
.info { display: flex; gap: 20px; align-items: center; min-height: 128px; }
.big-note {
  display: grid; place-items: center; flex-shrink: 0; width: 112px; height: 112px; border-radius: 50%;
  font-family: var(--display); font-weight: 800; font-size: 46px; color: var(--velvet);
  background: var(--c); box-shadow: 0 0 60px -10px var(--c), inset 0 -6px 0 rgba(0,0,0,.15);
  animation: pillIn .3s cubic-bezier(.2,.9,.3,1.3);
}
.info h2 { margin: 0; font-family: var(--display); font-size: 26px; letter-spacing: -0.01em; }
.info p { margin: 4px 0 0; color: var(--pearl-dim); }
.facts { display: flex; gap: 18px; margin-top: 10px; flex-wrap: wrap; }
.facts div { display: flex; flex-direction: column; }
.facts b { font-family: var(--display); font-size: 20px; }
.facts span { font-size: 12px; color: var(--pearl-dim); }

/* Keyboard answer pad */
.keys { display: grid; grid-template-columns: repeat(14, 1fr); grid-template-rows: 64px 72px; gap: 8px; max-width: 640px; }
.key {
  border: 0; border-radius: 16px; cursor: pointer; background: var(--c); color: var(--velvet);
  font-family: var(--display); font-weight: 800; font-size: 22px;
  box-shadow: inset 0 -5px 0 rgba(0,0,0,.2); transition: transform .1s, filter .15s;
}
.key.sharp { font-size: 18px; filter: saturate(.85) brightness(.88); }
.key:hover { transform: translateY(-2px); }
.key:active { transform: translateY(1px); }
.key.right { animation: keyGood .5s ease; box-shadow: 0 0 0 4px var(--good), 0 0 30px var(--good); }
.key.wrong { animation: shake .4s ease; opacity: .45; }
.key[disabled] { cursor: default; }
@keyframes keyGood { 40% { transform: scale(1.08); } }

/* Summary */
.summary { display: grid; gap: 18px; }
.summary-top { display: flex; gap: 34px; flex-wrap: wrap; align-items: flex-end; }
.big-stat b { display: block; font-family: var(--display); font-size: 56px; line-height: 1; letter-spacing: -0.03em; }
.big-stat span { color: var(--pearl-dim); font-size: 14px; }

/* Chords */
.chord-name { font-family: var(--display); font-size: clamp(54px, 7vw, 88px); font-weight: 800; letter-spacing: -0.04em; line-height: .95; margin: 0; }
.tones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.tone { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 12px 6px 6px; border-radius: 999px; background: rgba(0,0,0,.25); }
.tone i { font-style: normal; display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 99px; color: var(--velvet); font-weight: 800; font-family: var(--display); font-size: 14px; }
.tone b { font-family: var(--display); font-size: 18px; }
.voicings { display: flex; gap: 12px; flex-wrap: wrap; }
.voicing {
  background: rgba(0,0,0,.2); border: 2px solid transparent; border-radius: 18px; padding: 8px 8px 4px;
  cursor: pointer; display: flex; flex-direction: column; align-items: center; color: var(--pearl-dim); font-size: 12px;
}
.voicing[aria-pressed="true"] { border-color: var(--amber); color: var(--pearl); background: rgba(255,200,87,.06); }
.voicing svg { width: 118px; height: auto; }
.prog { display: flex; gap: 10px; flex-wrap: wrap; }
.prog-card {
  min-width: 92px; padding: 12px 14px; border-radius: 16px; background: rgba(0,0,0,.22); border: 2px solid transparent;
  cursor: pointer; text-align: left; color: var(--pearl);
}
.prog-card small { display: block; color: var(--pearl-dim); font-size: 13px; }
.prog-card b { font-family: var(--display); font-size: 24px; }
.prog-card.on { border-color: var(--amber); background: rgba(255,200,87,.1); transform: translateY(-3px); transition: transform .15s; }

/* Legend */
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--pearl-dim); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }

/* Ear */
.answers { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.answer {
  text-align: left; border: 1px solid var(--line); background: var(--velvet-3); color: var(--pearl);
  border-radius: 16px; padding: 12px 14px; cursor: pointer;
}
.answer b { display: block; font-family: var(--display); font-size: 19px; }
.answer small { color: var(--pearl-dim); font-size: 12.5px; }
.answer:hover { background: var(--velvet-4); }
.answer.right { border-color: var(--good); box-shadow: 0 0 0 2px var(--good); background: rgba(94,230,168,.12); }
.answer.wrong { border-color: var(--bad); opacity: .55; animation: shake .4s; }
.play-orb {
  width: 132px; height: 132px; border-radius: 50%; border: 0; cursor: pointer;
  background: radial-gradient(circle at 35% 30%, #ffe2a3, var(--amber) 45%, var(--amber-deep));
  color: #2a1f05; display: grid; place-items: center;
  box-shadow: 0 0 0 10px rgba(255,200,87,.08), 0 0 70px -10px var(--amber);
}
.play-orb svg { width: 52px; height: 52px; }
.play-orb.playing { animation: orb 0.9s ease-in-out infinite; }
@keyframes orb { 50% { box-shadow: 0 0 0 22px rgba(255,200,87,.04), 0 0 90px -6px var(--amber); } }
.ear-top { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
.verdict { font-family: var(--display); font-size: 26px; font-weight: 700; min-height: 36px; }
.verdict.good { color: var(--good); }
.verdict.bad { color: var(--bad); }

/* Tuner */
.tuner { display: grid; grid-template-columns: minmax(260px, 420px) 1fr; gap: 28px; align-items: center; }
.dial { width: 100%; height: auto; }
.dial .needle { transition: transform .12s ease-out; transform-origin: 200px 200px; }
.tuner-read { text-align: center; margin-top: -8px; }
.tuner-read b { font-family: var(--display); font-size: 64px; line-height: 1; }
.tuner-read div { color: var(--pearl-dim); }
.ref-strings { display: flex; gap: 10px; flex-wrap: wrap; }
.ref-btn {
  width: 64px; height: 64px; border-radius: 50%; border: 0; cursor: pointer; background: var(--c); color: var(--velvet);
  font-family: var(--display); font-weight: 800; font-size: 20px; display: grid; place-items: center; line-height: 1;
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.2);
}
.ref-btn small { font-size: 10px; font-weight: 600; opacity: .7; }

/* Progress */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { padding: 16px 18px; border-radius: 18px; background: rgba(0,0,0,.2); }
.stat b { display: block; font-family: var(--display); font-size: 34px; line-height: 1.05; }
.stat span { color: var(--pearl-dim); font-size: 13px; }
.bars { display: grid; grid-template-columns: repeat(12, 1fr); gap: 8px; align-items: end; height: 160px; }
.bar { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bar i { width: 100%; max-width: 34px; border-radius: 8px 8px 4px 4px; background: var(--c); min-height: 4px; transition: height .5s cubic-bezier(.2,.8,.2,1); }
.bar span { font-family: var(--display); font-weight: 700; font-size: 14px; }
.bar small { font-size: 11px; color: var(--pearl-dim); }
.heat-legend { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--pearl-dim); }
.heat-legend i { width: 160px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, #ff6b7a, #ffc857, #5ee6a8); }

/* Settings dialog */
dialog {
  border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--velvet-2); color: var(--pearl);
  padding: 26px; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 40px);
}
dialog::backdrop { background: rgba(10, 8, 30, .6); backdrop-filter: blur(4px); }
dialog h2 { margin: 0 0 16px; font-family: var(--display); font-size: 28px; }
dialog .controls { gap: 16px; }
dialog select { background: var(--velvet-3); color: var(--pearl); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font: inherit; }
.dlg-foot { display: flex; justify-content: flex-end; margin-top: 22px; }

.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); opacity: 0;
  background: var(--pearl); color: var(--velvet); padding: 12px 18px; border-radius: 14px; font-weight: 700;
  transition: opacity .2s, transform .2s; pointer-events: none; z-index: 50; max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.kbd { display: inline-block; padding: 1px 7px; border-radius: 6px; border: 1px solid var(--line); background: rgba(0,0,0,.25); font-size: 12px; }

/* ---------- Responsive ---------- */
@media (max-width: 1080px) {
  .panel-grid, .tuner { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .rail {
    position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; z-index: 20;
    flex-direction: row; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); gap: 2px;
    overflow-x: auto; border-right: 0; border-top: 1px solid var(--line);
    background: rgba(24, 21, 52, .96); backdrop-filter: blur(10px);
  }
  .logo, .rail-foot { display: none; }
  #nav { flex-direction: row; gap: 2px; }
  .nav-btn { width: 68px; flex-shrink: 0; font-size: 11px; }
  main { padding: 14px 16px 110px; }
  .stage { margin: 6px -16px 0; padding: 0 16px; }
  .round-bar { left: 16px; right: 16px; }
  .row { grid-template-columns: 1fr; gap: 6px; }
  .top-actions .icon-btn { width: 40px; height: 40px; }
  .topbar p { font-size: 14px; }
  .rotate-hint { display: block; }
  .hud-stats { gap: 14px; }
  .hud-stat b { font-size: 21px; }
  .note-pill { min-width: 52px; height: 52px; font-size: 26px; }
  .keys { grid-template-rows: 54px 62px; gap: 5px; }
  .key { font-size: 18px; border-radius: 12px; }
  .key.sharp { font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* ================= v2: sections, path, lessons, play ================= */
[hidden] { display: none !important; }
.subtabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 4px 0 6px; padding-bottom: 2px; }
.subtab { flex-shrink: 0; border: 1px solid var(--line); background: transparent; color: var(--pearl-dim); padding: 8px 16px; border-radius: 999px; cursor: pointer; font-size: 15px; }
.subtab:hover { color: var(--pearl); border-color: rgba(241,233,218,.3); }
.subtab[aria-selected="true"] { background: var(--velvet-4); color: var(--pearl); border-color: transparent; }
.nav-btn span { font-size: 12.5px; }

/* metronome */
.metro { display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 6px 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--velvet-2); }
.metro .m-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--velvet-4); }
.metro .m-dot.beat { animation: mdot .22s ease-out; }
.metro .m-dot.accent { background: var(--amber); }
@keyframes mdot { from { background: var(--pearl); transform: scale(1.5); } }
.metro button { border: 0; background: none; cursor: pointer; color: var(--pearl); display: flex; align-items: baseline; gap: 3px; padding: 6px; border-radius: 10px; }
.metro button:hover { background: rgba(255,255,255,.06); }
.metro .m-play svg { width: 16px; height: 16px; }
.metro .m-bpm { font-family: var(--display); font-size: 17px; }
.metro small { font-size: 11px; color: var(--pearl-dim); }
.metro.running { border-color: rgba(255,200,87,.5); }
.pop { position: fixed; inset: 74px 28px auto auto; margin: 0; z-index: 40; width: min(360px, calc(100vw - 24px)); border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--velvet-2); color: var(--pearl); padding: 18px; display: none; }
.pop[open] { display: grid; gap: 12px; }
.pop h3 { margin: 0; font-family: var(--display); font-size: 22px; }
.pop .btn { padding: 8px 12px; }

/* rail level */
.rail-level { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 70px; border: 0; background: none; color: var(--pearl-dim); cursor: pointer; padding: 6px 0; border-radius: 12px; }
.rail-level:hover { background: rgba(255,255,255,.05); }
.rail-level small { font-size: 11px; }
.rl-bar { width: 52px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
.rl-bar i { display: block; height: 100%; background: var(--amber); }

/* roadmap */
.roadmap { display: flex; gap: 22px; align-items: center; }
.rm-ring { position: relative; width: 96px; height: 96px; flex-shrink: 0; display: grid; place-items: center; }
.rm-ring svg { position: absolute; inset: 0; }
.rm-ring > div { display: flex; flex-direction: column; align-items: center; line-height: 1.05; }
.rm-ring b { font-family: var(--display); font-size: 24px; }
.rm-ring small { font-size: 12px; color: var(--pearl-dim); }
.rm-track { flex: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.rm-seg { position: relative; display: flex; flex-direction: column; gap: 6px; text-align: left; border: 1px solid var(--line); background: rgba(0,0,0,.18); color: var(--pearl-dim); border-radius: 16px; padding: 12px 12px 10px; cursor: pointer; min-width: 0; }
.rm-seg:hover { border-color: rgba(241,233,218,.3); }
.rm-seg.here { border-color: var(--amber); color: var(--pearl); background: rgba(255,200,87,.07); }
.rm-seg.full .rm-bar i { background: var(--good); }
.rm-bar { height: 7px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; }
.rm-bar i { display: block; height: 100%; background: var(--amber); border-radius: 4px; transition: width .6s; }
.rm-name { font-size: 13.5px; line-height: 1.25; color: var(--pearl); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rm-name b { font-family: var(--display); color: var(--amber); margin-right: 3px; }
.rm-rank { font-size: 11.5px; }
.rm-pin { position: absolute; top: -11px; right: 10px; font-size: 11px; font-weight: 700; background: var(--amber); color: #2a1f05; padding: 2px 8px; border-radius: 99px; }

.next-card { display: flex; align-items: center; gap: 20px; padding: 22px; border-radius: var(--r-lg); background: linear-gradient(120deg, rgba(255,255,255,.04), transparent), var(--velvet-2); border: 1px solid var(--line); box-shadow: inset 4px 0 0 var(--c); }
.nc-icon { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: var(--c); color: var(--velvet); flex-shrink: 0; }
.nc-icon svg { width: 34px; height: 34px; }
.nc-txt { flex: 1; min-width: 0; }
.nc-txt small { color: var(--pearl-dim); font-size: 13px; }
.nc-txt h2 { margin: 2px 0 4px; font-family: var(--display); font-size: 28px; letter-spacing: -0.01em; line-height: 1.1; }
.nc-txt p { margin: 0; color: var(--pearl-dim); }

.levels { display: grid; gap: 14px; }
.level { border: 1px solid var(--line); border-radius: var(--r-lg); background: rgba(0,0,0,.12); }
.level.current { border-color: rgba(255,200,87,.35); }
.lv-head { display: flex; gap: 16px; align-items: center; padding: 16px 18px; flex-wrap: wrap; }
.lv-num { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--velvet-3); font-family: var(--display); font-size: 22px; font-weight: 700; color: var(--amber); flex-shrink: 0; }
.lv-num svg { width: 24px; height: 24px; color: var(--good); }
.lv-num.small { width: 32px; height: 32px; border-radius: 10px; font-size: 16px; }
.lv-txt { flex: 1; min-width: 220px; }
.lv-txt small { color: var(--pearl-dim); font-size: 12.5px; }
.lv-txt h3 { margin: 0; font-family: var(--display); font-size: 23px; }
.lv-txt p { margin: 2px 0 0; color: var(--pearl-dim); font-size: 14.5px; }
.lv-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.lv-count { font-family: var(--display); font-weight: 700; }
.lv-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.lv-actions .chip { font-size: 13.5px; padding: 6px 11px; }
.chip svg { width: 15px; height: 15px; }
.nodes { display: grid; gap: 4px; padding: 34px 18px 22px; }
.node-row { display: flex; align-items: center; gap: 16px; margin-left: calc(50% - 160px + var(--off) * 46px); }
.node { position: relative; width: 66px; height: 66px; border-radius: 50%; border: 0; cursor: pointer; flex-shrink: 0; display: grid; place-items: center; color: var(--pearl-dim); background: var(--velvet-3); box-shadow: inset 0 -5px 0 rgba(0,0,0,.25); transition: transform .12s; }
.node svg { width: 30px; height: 30px; }
.node:hover { transform: translateY(-2px); }
.node.done { background: var(--c); color: var(--velvet); }
.node.next { background: var(--c); color: var(--velvet); box-shadow: 0 0 0 6px rgba(255,255,255,.07), 0 0 0 10px color-mix(in srgb, var(--c) 35%, transparent), 0 0 36px -4px var(--c); animation: nodePulse 2s ease-in-out infinite; }
@keyframes nodePulse { 50% { transform: scale(1.06); } }
.node-go { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); background: var(--pearl); color: var(--velvet); font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
.node-label { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.node-label b { font-size: 15.5px; }
.node-label span { font-size: 12.5px; color: var(--pearl-dim); }
.stars { display: inline-flex; gap: 2px; }
.stars i, .stars span { color: rgba(255,255,255,.15); display: inline-flex; }
.stars i svg { width: 14px; height: 14px; }
.stars .on { color: var(--amber); }
.stars.big span svg { width: 54px; height: 54px; }
.stars.big span.on { animation: starIn .5s cubic-bezier(.2,.9,.3,1.5) both; }
.stars.big span:nth-child(2) { animation-delay: .15s; } .stars.big span:nth-child(3) { animation-delay: .3s; }
@keyframes starIn { from { transform: scale(0) rotate(-40deg); } }

/* lesson player */
.lesson-hud { display: flex; align-items: center; gap: 14px; width: 100%; }
.lesson-title { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.lesson-title small { color: var(--pearl-dim); font-size: 12.5px; }
.lesson-title b { font-family: var(--display); font-size: 22px; }
.lp-dots { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.lp-dots i { width: 26px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.1); }
.lp-dots i.chk { width: 12px; }
.lp-dots i.done { background: var(--good); }
.lp-dots i.now { background: var(--amber); }
.lesson-card { background: var(--velvet-2); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px 24px; display: grid; gap: 14px; max-width: 980px; }
.lesson-text { margin: 0; font-size: 20px; line-height: 1.5; max-width: 68ch; }
.lesson-text b { color: var(--amber); font-weight: 700; }
.lesson-check:empty { display: none; }
.lesson-nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lesson-spacer { flex: 1; }
.btn-quiet { background: transparent; border-color: transparent; color: var(--pearl-dim); font-weight: 500; }
.btn-quiet:hover { background: rgba(255,255,255,.05); }
.check-q { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; background: rgba(0,0,0,.22); }
.check-q > svg { width: 26px; height: 26px; color: var(--amber); flex-shrink: 0; margin-top: 2px; }
.check-q b { font-size: 17px; display: inline; }
.check-q small { display: block; color: var(--pearl-dim); font-size: 13.5px; margin-top: 2px; }
.check-count { margin-left: 8px; font-size: 12px; color: var(--pearl-dim); background: rgba(255,255,255,.07); padding: 1px 8px; border-radius: 99px; }
.check-ok { display: flex; gap: 10px; align-items: center; color: var(--good); font-weight: 700; font-size: 17px; padding: 10px 0; }
.check-ok svg { width: 26px; height: 26px; }
.check-why { margin: 0; color: var(--pearl-dim); font-size: 14.5px; }
.answers.quiz { margin-top: 10px; }
.inline-note { display: inline-grid; place-items: center; min-width: 34px; height: 34px; padding: 0 8px; border-radius: 99px; color: var(--velvet); font-family: var(--display); font-weight: 800; margin: 0 2px; }
.seq-dots { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
.seq-dots i { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.08); border: 2px solid transparent; }
.seq-dots i.now { border-color: var(--amber); }
.done-card { text-align: center; justify-items: center; padding: 34px; }
.done-card h2 { margin: 6px 0 0; font-family: var(--display); font-size: 34px; }
.done-card p { margin: 0; }
.tone-row { display: flex; gap: 8px; flex-wrap: wrap; }
pre.tab { margin: 0; padding: 14px 16px; border-radius: 14px; background: rgba(0,0,0,.28); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 15px; line-height: 1.45; overflow-x: auto; color: var(--pearl); }
.circle5 { width: 260px; max-width: 100%; }
.chroma { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; height: 120px; align-items: end; margin-top: 10px; }
.chroma.big { height: 200px; }
.chroma .cb { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.chroma .cb i { width: 100%; max-width: 30px; height: 6%; border-radius: 6px 6px 3px 3px; background: var(--c); opacity: .85; transition: height .1s; }
.chroma .cb span { font-size: 12px; font-weight: 700; color: var(--pearl-dim); }
.chroma .cb.want span { color: var(--pearl); }
.chroma .cb.want i { outline: 2px solid var(--pearl); outline-offset: 2px; }

/* guidebooks */
.guides { display: grid; gap: 12px; }
details.guide { border: 1px solid var(--line); border-radius: var(--r-lg); background: rgba(0,0,0,.12); }
details.guide summary { display: flex; gap: 14px; align-items: center; padding: 16px 18px; cursor: pointer; list-style: none; }
details.guide summary::-webkit-details-marker { display: none; }
details.guide summary b { display: block; font-family: var(--display); font-size: 21px; }
details.guide summary small { color: var(--pearl-dim); }
.guide-body { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; padding: 0 18px 18px; }
.g-item { background: var(--velvet-2); border-radius: 16px; padding: 14px 16px; }
.g-item h4 { margin: 0 0 6px; font-family: var(--display); font-size: 17px; color: var(--amber); }
.g-item div { font-size: 14.5px; line-height: 1.55; color: var(--pearl); }
.g-lessons { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.g-lessons .chip svg { color: var(--good); }

/* jam */
.jam-now { display: flex; gap: 28px; align-items: flex-end; flex-wrap: wrap; }
.jam-chord { font-family: var(--display); font-weight: 800; font-size: clamp(64px, 8vw, 104px); line-height: .9; letter-spacing: -0.03em; }
.jam-next { font-family: var(--display); font-weight: 700; font-size: 36px; color: var(--pearl-dim); }
.beats { display: flex; gap: 8px; margin-left: auto; padding-bottom: 10px; }
.beats i { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,.1); transition: background .08s; }
.beats i.on { background: var(--amber); box-shadow: 0 0 14px var(--amber); }
.beats i:first-child.on { background: var(--pearl); }
.prog .prog-card { cursor: default; }
#jm-bars .prog-card { min-width: 70px; padding: 8px 12px; }
#jm-bars .prog-card b { font-size: 19px; }

/* tabs */
.tab-view { border-radius: 16px; background: rgba(0,0,0,.28); overflow-x: auto; }
.tab-view pre { margin: 0; padding: 16px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 16px; line-height: 1.5; color: var(--pearl-dim); }
.tab-view span { color: var(--pearl); border-radius: 4px; }
.tab-view span.on { background: var(--amber); color: #2a1f05; box-shadow: 0 0 0 3px var(--amber); }
textarea { width: 100%; background: rgba(0,0,0,.25); color: var(--pearl); border: 1px solid var(--line); border-radius: 14px; padding: 12px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; resize: vertical; }
input[type="time"] { background: var(--velvet-3); color: var(--pearl); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; color-scheme: dark; }

/* live + check */
.live-top { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.history { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; min-height: 40px; }
.history .note-chip { width: 36px; height: 36px; font-size: 13px; cursor: default; }
.changes { display: flex; gap: 30px; }
.changes div { display: flex; flex-direction: column; }
.changes b { font-family: var(--display); font-size: 56px; line-height: 1; }
.changes span { color: var(--pearl-dim); font-size: 13px; }
#neck .caged-label { font-family: var(--display); font-weight: 800; font-size: 13px; }
.mk.seqhint .body { stroke-dasharray: 3 3; stroke: rgba(241,233,218,.6); }

@media (max-width: 1080px) { .rm-track { grid-template-columns: repeat(6, minmax(120px, 1fr)); overflow-x: auto; } }
@media (max-width: 760px) {
  .roadmap { flex-direction: column; align-items: stretch; }
  .rm-ring { margin: 0 auto; }
  .rm-track { display: flex; overflow-x: auto; padding-top: 12px; }
  .rm-seg { min-width: 150px; }
  .next-card { flex-direction: column; align-items: flex-start; }
  .node-row { margin-left: calc(14px + (var(--off) + 2) * 14px); }
  .lesson-text { font-size: 17.5px; }
  .lesson-card { padding: 18px; }
  .lp-dots { display: none; }
  .metro { padding: 0 4px 0 8px; }
  .metro small { display: none; }
  .pop { inset: auto 12px 90px 12px; width: auto; }
  .top-actions { gap: 6px; }
  .changes b { font-size: 42px; }
  .jam-next { font-size: 26px; }
}
@media (max-width: 760px) {
  html, body { overflow-x: hidden; }
  .topbar { flex-direction: column-reverse; gap: 10px; }
  .top-actions { margin-left: 0; width: 100%; justify-content: flex-end; }
  .roadmap, .rm-track, .levels, .level, .next-card { min-width: 0; max-width: 100%; }
  .rm-track { width: 100%; }
  .lv-meta { align-items: flex-start; width: 100%; }
  .lv-actions { justify-content: flex-start; }
  .lv-txt { min-width: 0; }
  .panel > *, .panel-grid > * { min-width: 0; }
}
.node-row:has(.node.next) { margin-top: 22px; }
/* v3: hand + techniques */
#neck .finger-num { font-family: var(--display); font-weight: 800; font-size: 12px; fill: #1d1a3b; text-anchor: middle; dominant-baseline: central; }
#neck .hand { pointer-events: none; }
#neck .tech-arc { fill: none; stroke: #ffc857; stroke-width: 2.5; stroke-dasharray: 5 4; }
#neck .slide-trail { stroke-width: 6; stroke-linecap: round; opacity: .45; }
#neck .bent-string { fill: none; stroke: #e9ecef; stroke-linejoin: round; }
.mk.vib .in { animation: vib .18s ease-in-out infinite alternate; }
@keyframes vib { from { transform: translateY(-3px); } to { transform: translateY(3px); } }

.welcome { display: flex; gap: 22px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 26px; border-radius: var(--r-lg); border: 1px solid rgba(255,200,87,.4); background: radial-gradient(600px 200px at 0% 0%, rgba(255,200,87,.12), transparent), var(--velvet-2); }
.welcome h2 { margin: 0 0 6px; font-family: var(--display); font-size: 30px; }
.welcome p { margin: 0; color: var(--pearl-dim); max-width: 56ch; }
.welcome-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.review-card { display: flex; gap: 18px; align-items: center; padding: 18px 22px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--velvet-2); box-shadow: inset 4px 0 0 #6fe0d6; flex-wrap: wrap; }
.review-card h3 { margin: 2px 0 4px; font-family: var(--display); font-size: 22px; }
.rv-icon { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: #6fe0d6; color: var(--velvet); }
.rv-icon svg { width: 28px; height: 28px; }
.path-foot { text-align: center; font-size: 14px; }
.linkish { background: none; border: 0; color: var(--amber); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 0; font: inherit; }
.node-label em.due { font-style: normal; color: #6fe0d6; font-weight: 700; }
.node-label .placed { font-size: 12px; color: var(--pearl-dim); border: 1px solid var(--line); border-radius: 99px; padding: 0 8px; width: fit-content; margin-top: 2px; }
.echo { display: grid; gap: 12px; }
.seq-dots.big i { width: 30px; height: 30px; }
/* circle of fifths */
.circle-wrap { display: grid; place-items: center; }
.cf { width: 100%; max-width: 480px; user-select: none; }
.cf-node { cursor: pointer; }
.cf-node circle { stroke: rgba(0,0,0,.35); stroke-width: 1.5; opacity: .45; transition: opacity .2s; }
.cf-node.near circle { opacity: 1; }
.cf-node.sel circle { stroke: #fff; stroke-width: 3.5; opacity: 1; }
.cf-node text { font-family: var(--display); font-weight: 800; font-size: 15px; fill: #1d1a3b; text-anchor: middle; pointer-events: none; }

select { background: var(--velvet-3); color: var(--pearl); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font: inherit; max-width: 100%; }

<script>'use strict';
/* ================= Utilities ================= */
const $ = (s, r = document) => r.querySelector(s);

const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= Music theory ================= */
const SHARPS = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];

const SCALES = [
  { id: 'major', name: 'Major', iv: [0, 2, 4, 5, 7, 9, 11], feel: 'Bright and settled. The do-re-mi scale.' },

const DEGREE_COLORS = { 1: '#ff7b54', 2: '#8be0a4', 3: '#ffd166', 4: '#6fe0d6', 5: '#5aa9ff', 6: '#f59bdc', 7: '#c69cff' };
// semitone -> [label, degree]
function intervalInfo(semi, context = []) {
  const s = mod(semi, 12);
  const ctx = context.map((x) => mod(x, 12));
  switch (s) {
    case 0: return ['R', 1];
    case 1: return ['♭2', 2];
    case 2: return [semi >= 12 || context.includes(14) ? '9' : '2', 2];

  { semi: 6, short: 'TT', name: 'Tritone', song: 'The Simpsons theme' },

];
const ordinal = (n) => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };

/* ================= State + storage ================= */
const KEY = 'fretwave.v1';
const store = {
  load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } },

const DEFAULTS = {

  drill: { strings: null, range: '0-12', naturals: true, smart: true, input: 'screen', kind: 'string', promptSound: true },

const saved = store.load();
const S = {

S.settings.drill = Object.assign({}, DEFAULTS.drill, S.settings.drill || {});
function persist() {
  const st = typeof Tunings !== 'undefined' && typeof current !== 'undefined' && current === Tunings && Tunings.real ? Object.assign({}, S.settings, { tuning: Tunings.real }) : S.settings;

  clearTimeout(persist._t);

function tuning() {
  const t = inst().tunings;
  if (!t[S.settings.tuning]) S.settings.tuning = Object.keys(t)[0];

}
const strings = () => tuning().midi;
const midiAt = (s, f) => strings()[s] + f;
const stringNumber = (s) => strings().length - s; // 1 = highest string
function stringLabel(s) {
  const open = strings()[s];
  return `${noteName(open % 12)} string`;
}
function allCells(pred = () => true, maxF = S.settings.frets) {
  const out = [];
  strings().forEach((open, s) => { for (let f = 0; f <= maxF; f++) { const m = open + f; if (pred(m, s, f)) out.push({ s, f, midi: m, pc: m % 12 }); } });
  return out;
}

const dateStr = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function today() { return dateStr(new Date()); }
function yesterday() { const d = new Date(); d.setDate(d.getDate() - 1); return dateStr(d); }
const statKey = (s, f) => `${S.settings.instrument}:${S.settings.tuning}:${s}:${f}`;
function cellStat(s, f) { return S.stats[statKey(s, f)] || { n: 0, ok: 0, ms: 0 }; }
function recordAnswer(s, f, correct, ms) {
  const k = statKey(s, f);
  const st = S.stats[k] || { n: 0, ok: 0, ms: 0 };
  st.n++; if (correct) { st.ok++; st.ms += Math.min(ms, 15000); }
  S.stats[k] = st;
  const t = today();
  if (S.daily.date !== t) { S.daily.date = t; S.daily.count = 0; }
  if (S.daily.last !== t) { S.daily.streak = S.daily.last === yesterday() ? S.daily.streak + 1 : 1; S.daily.last = t; }
  S.daily.count++;
  persist(); renderDaily();
}
function currentStreak() { return (S.daily.last === today() || S.daily.last === yesterday()) ? S.daily.streak : 0; }

/* ================= Audio: Karplus-Strong plucked strings ================= */
const Sound = {
  ctx: null, master: null, cache: new Map(), lastPlay: 0, drone: null,
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;

      const comp = this.ctx.createDynamicsCompressor();

  setVolume(v) { if (this.master) this.master.gain.value = v; },
  buffer(midi) {

/* ================= Listening: pitch-class energy (chroma) + chord matching ================= */
function chromaOf(db, sr, fftSize) {
  const out = new Float32Array(12);
  const binHz = sr / fftSize;

  let peak = -Infinity;
  for (let i = lo; i <= hi; i++) if (db[i] > peak) peak = db[i];
  if (peak < -78) return null; // silence
  const floor = peak - 38;
  for (let i = lo + 1; i < hi; i++) {
    const v = db[i];
    if (v < floor || v < db[i - 1] || v < db[i + 1]) continue; // local spectral peaks only
    const f = i * binHz;
    const midi = 69 + 12 * Math.log2(f / 440);
    const pc = mod(Math.round(midi), 12);
    const mag = Math.pow(10, (v - peak) / 20);
    out[pc] += mag / (1 + f / 900);
  }

  if (!mx) return null;

}

const Metro = {
  on: false, bpm: 90, beats: 4, beat: 0, next: 0, timer: null, listeners: new Set(),
  trainer: { on: false, step: 4, every: 2, target: 140, bars: 0 },
  start() {
    const ctx = Sound.ensure(); if (!ctx) return;
    this.on = true; this.beat = 0; this.next = ctx.currentTime + 0.08; this.trainer.bars = 0;
    clearInterval(this.timer); this.timer = setInterval(() => this.tick(), 25); renderMetro();
  },
  stop() { this.on = false; clearInterval(this.timer); renderMetro(); },
  toggle() { this.on ? this.stop() : this.start(); },
  setBpm(v) { this.bpm = clamp(Math.round(v), 30, 260); renderMetro(); },
  tick() {
    const ctx = Sound.ctx;
    while (this.next < ctx.currentTime + 0.12) {
      const b = this.beat, t = this.next;
      Sound.click(t, b === 0);
      const delay = Math.max(0, (t - ctx.currentTime) * 1000);
      setTimeout(() => { pulseMetro(b === 0); this.listeners.forEach((fn) => fn(b)); }, delay);
      this.next += 60 / this.bpm;
      this.beat = (this.beat + 1) % this.beats;
      if (this.beat === 0 && this.trainer.on) {
        this.trainer.bars++;
        if (this.trainer.bars % this.trainer.every === 0 && this.bpm < this.trainer.target) {
          this.bpm = Math.min(this.trainer.target, this.bpm + this.trainer.step);
          setTimeout(() => { renderMetro(); toast(`Tempo up: ${this.bpm} bpm`, 1100); }, delay);
        }
      }
    }
  },
};

function findVoicings(rootPc, iv, maxFret = 12) {

      for (let f = Math.max(1, start); f <= start + 3; f++) if (pcs.includes((open + f) % 12)) o.push(f);

        if (sounding.some((x) => x.f === 0) && mx > 5) return;

const Tech = {
  timers: [],
  later(ms, fn) { const t = setTimeout(fn, ms); this.timers.push(t); if (typeof L !== 'undefined' && L.timers) L.timers.push(t); return t; },
  anim(dur, fn, done) { const t0 = performance.now(); const tick = (now) => { const k = Math.min(1, (now - t0) / (dur * 1000)); fn(k); if (k < 1) requestAnimationFrame(tick); else if (done) done(); }; requestAnimationFrame(tick); },
  arc(s, f1, f2, label) {
    const x1 = Neck.X(Neck.cx(f1)), x2 = Neck.X(Neck.cx(f2)), y = Neck.y(s) - 22;
    el('path', { d: `M${x1},${y} Q${(x1 + x2) / 2},${y - 26} ${x2},${y}`, class: 'tech-arc' }, Neck.fx);
    const t = el('text', { x: (x1 + x2) / 2, y: y - 18, class: 'link-label' }, Neck.fx); t.textContent = label;
  },
  hammer(s, f1, f2, at = 0, label = 'h') {
    this.later(at * 1000, () => { Neck.noteMark(s, f1); Neck.play(s, f1, 0, 0.5); });
    this.later(at * 1000 + 380, () => { Neck.noteMark(s, f2, { ring: true }); Sound.play(midiAt(s, f2), 0, 0.36, 0, true); Neck.pluck(s, f2); this.arc(s, f1, f2, label); });
    return at + 0.9;
  },
  pull(s, f2, f1, at = 0) {
    this.later(at * 1000, () => { Neck.noteMark(s, f2); Neck.noteMark(s, f1, { cls: 'dim' }); Neck.play(s, f2, 0, 0.5); });
    this.later(at * 1000 + 380, () => { Neck.unmark(s, f2); Neck.noteMark(s, f1, { ring: true }); Sound.play(midiAt(s, f1), 0, 0.34, 0, true); Neck.pluck(s, f1); this.arc(s, f2, f1, 'p'); });
    return at + 0.9;
  },
  slide(s, f1, f2, at = 0, dur = 0.42, quiet = false) {
    this.later(at * 1000, () => {
      const n = Sound.play(midiAt(s, f1), 0, 0.5);
      const steps = Math.abs(f2 - f1), dir = Math.sign(f2 - f1);
      if (n) for (let i = 1; i <= steps; i++) n.src.playbackRate.setValueAtTime(Math.pow(2, (i * dir) / 12), n.t + (i / steps) * dur);
      if (quiet) return;
      Neck.pluck(s, f1);
      const m = Neck.noteMark(s, f1, { ring: true });
      const x1 = Neck.X(Neck.cx(f1)), x2 = Neck.X(Neck.cx(f2)), y = Neck.y(s);
      el('line', { x1, x2, y1: y, y2: y, class: 'slide-trail', stroke: noteColor(midiAt(s, f2) % 12) }, Neck.fxBelow);
      this.anim(dur, (k) => {
        const fret = Math.round(f1 + (f2 - f1) * k);
        if (m) { m.setAttribute('transform', `translate(${x1 + (x2 - x1) * k},${y})`); const t = m.querySelector('text'); if (t) t.textContent = noteName(midiAt(s, fret) % 12); const c = m.querySelector('.body'); if (c) c.setAttribute('fill', noteColor(midiAt(s, fret) % 12)); }
      }, () => { Neck.unmark(s, f1); Neck.noteMark(s, f2, { ring: true }); const t = el('text', { x: (x1 + x2) / 2, y: y - 22, class: 'link-label' }, Neck.fx); t.textContent = f2 > f1 ? 'slide /' : 'slide \\'; });
    });
    return at + dur + 0.6;
  },
  bend(s, f, semis = 2, at = 0, o = {}) {
    const up = o.up || 0.32, hold = o.hold ?? 0.5;
    this.later(at * 1000, () => {
      const n = Sound.play(midiAt(s, f), 0, 0.5);
      const r = Math.pow(2, semis / 12);
      if (n) { const p = n.src.playbackRate; p.setValueAtTime(1, n.t + 0.05); p.linearRampToValueAtTime(r, n.t + 0.05 + up); if (o.release) { p.setValueAtTime(r, n.t + 0.05 + up + hold); p.linearRampToValueAtTime(1, n.t + 0.05 + up + hold + up); } }
      if (o.quiet) return;
      const sg = Neck.strEls[s]; if (sg) sg.style.opacity = 0;
      const g = Neck.g, y = Neck.y(s), x = Neck.X(Neck.cx(f));
      const off = Math.min(g.gap * 0.95, g.gap * 0.42 * semis) * (s === 0 ? -1 : 1);
      const path = el('path', { class: 'bent-string', 'stroke-width': Math.max(1.4, (inst().gauge[s] || 2)) }, Neck.fx);
      const m = Neck.noteMark(s, f, { ring: true });
      const target = mod(midiAt(s, f) + semis, 12);
      const set = (k) => { const yy = y + off * k; path.setAttribute('d', `M${Neck.X(g.nutX)},${y} L${x},${yy} L${Neck.X(g.endX)},${y}`); if (m) m.setAttribute('transform', `translate(${x},${yy})`); };
      set(0);
      this.later(50, () => this.anim(up, set, () => {
        if (m) { const t = m.querySelector('text'); if (t) t.textContent = noteName(target); const c = m.querySelector('.body'); if (c) c.setAttribute('fill', noteColor(target)); }
        const lab = el('text', { x, y: y + off - 26 * Math.sign(off || 1), class: 'link-label' }, Neck.fx); lab.textContent = semis === 2 ? 'full bend' : semis === 1 ? '½ bend' : `${semis / 2} bend`;
        if (o.release) this.later(hold * 1000, () => this.anim(up, (k) => set(1 - k), () => { if (sg) sg.style.opacity = ''; path.remove(); }));
        else this.later(hold * 1000 + 700, () => { if (sg) sg.style.opacity = ''; path.remove(); });
      }));
    });
    return at + up + hold + (o.release ? up : 0) + 0.5;
  },
  vibrato(s, f, at = 0, dur = 1.8, depth = 0.014, quiet = false) {
    this.later(at * 1000, () => {
      const n = Sound.play(midiAt(s, f), 0, 0.5);
      if (n) { const ctx = Sound.ctx, lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 5.5; lg.gain.setValueAtTime(0, n.t); lg.gain.linearRampToValueAtTime(depth, n.t + 0.35); lfo.connect(lg); lg.connect(n.src.playbackRate); lfo.start(n.t); lfo.stop(n.t + dur); }
      if (quiet) return;
      Neck.pluck(s, f);
      const m = Neck.noteMark(s, f, { ring: true, cls: 'vib' });
      const t = el('text', { x: Neck.X(Neck.cx(f)), y: Neck.y(s) - 28, class: 'link-label' }, Neck.fx); t.textContent = 'vibrato ~~~';
      this.later(dur * 1000, () => { if (m) m.classList.remove('vib'); });
    });
    return at + dur;
  },
  stop() { this.timers.forEach(clearTimeout); this.timers = []; },
};

const seg = (id, opts, val) => `<div class="seg" id="${id}" role="group">${opts.map(([v, t]) => `<button type="button" data-v="${v}" aria-pressed="${String(v) === String(val)}">${t}</button>`).join('')}</div>`;
function wireSeg(root, id, cb) {
  const g = $('#' + id, root); if (!g) return;
  g.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    $$('button', g).forEach((x) => x.setAttribute('aria-pressed', x === b));
    cb(b.dataset.v);
  });
}
function noteChips(selected, opts = {}) {
  return Array.from({ length: 12 }, (_, pc) => (opts.naturalsOnly && !IS_NATURAL[pc]) ? '' :
    `<button type="button" class="note-chip" data-pc="${pc}" style="--c:${noteColor(pc)}" aria-pressed="${pc === selected}" aria-label="${spoken(pc)}">${noteName(pc)}</button>`).join('');
}
function hudStats(items) {
  return `<div class="hud-stats">${items.map(([v, l, hot]) => `<div class="hud-stat${hot ? ' hot' : ''}"><b>${v}</b><span>${l}</span></div>`).join('')}</div>`;
}

/* ================= Explore ================= */
const Explore = {
  id: 'explore', nav: 'Explore', title: 'Explore the neck',
  help: 'Tap any fret to hear it. Switch views to see interval shapes, or how harmonics and string physics work.',
  show: 'all', focus: 0, sel: null, revealed: new Set(), view: 'notes',
  mount(p) {
    p.innerHTML = `<div class="row view-row"><span class="lbl">View</span>${seg('ex-view', [['notes', 'Notes'], ['intervals', 'Interval shapes'], ['harmonics', 'Harmonics and physics']], this.view)}</div><div id="ex-body"></div>`;
    wireSeg(p, 'ex-view', (v) => { if (HarmonicLab.unmount) HarmonicLab.unmount(); this.view = v; Neck.clear(); this.mount(p); });
    const body = $('#ex-body', p);
    if (this.view === 'intervals') { this.p = body; IntervalLab.mount(body, this); return; }
    if (this.view === 'harmonics') { this.p = body; HarmonicLab.mount(body); return; }
    this.mountNotes(body);
  },
  unmount() { HarmonicLab.unmount(); },
  explain(s, f) { if (this.view === 'intervals') return IntervalLab.explain(s, f); if (this.view === 'harmonics') return HarmonicLab.explain(s, f); return null; },
  mountNotes(p) {
    this.p = p; this.sel = null;
    p.innerHTML = `<div class="panel-grid">
      <div class="controls">
        <div class="row"><span class="lbl">Show</span>${seg('ex-show', [['all', 'All notes'], ['nat', 'Naturals only'], ['one', 'One note'], ['none', 'Blank neck']], this.show)}</div>
        <div class="row"><span class="lbl">Pick a note</span><div class="wrap" id="ex-notes">${noteChips(this.show === 'one' ? this.focus : -1)}</div></div>
        <div class="row"><span class="lbl">Listen</span><div class="wrap">
          <button class="btn" id="ex-run">${ICONS.play}<span>Play every <span id="ex-run-n">${noteName(this.focus)}</span></span></button>
          <button class="btn" id="ex-open">${ICONS.strum}Strum the open strings</button></div></div>
      </div>
      <div class="surface info" id="ex-info"></div>
    </div>`;
    wireSeg(p, 'ex-show', (v) => { this.show = v; this.revealed.clear(); this.syncChips(); this.redraw(); });
    $('#ex-notes', p).addEventListener('click', (e) => {
      const b = e.target.closest('.note-chip'); if (!b) return;
      this.focus = +b.dataset.pc; this.show = 'one';
      $$('#ex-show button', p).forEach((x) => x.setAttribute('aria-pressed', x.dataset.v === 'one'));
      this.syncChips(); this.redraw();
      Sound.play(48 + this.focus + (this.focus < 4 ? 12 : 0)); Voice.say(spoken(this.focus));
    });
    $('#ex-run', p).addEventListener('click', () => this.runAll());
    $('#ex-open', p).addEventListener('click', () => strings().forEach((_, s) => Neck.play(s, 0, s * 0.07)));
    this.renderInfo(); this.redraw();
  },
  syncChips() {
    $$('#ex-notes .note-chip', this.p).forEach((b) => b.setAttribute('aria-pressed', this.show === 'one' && +b.dataset.pc === this.focus));
    const n = $('#ex-run-n', this.p); if (n) n.textContent = noteName(this.focus);
  },
  redraw() {
    Neck.clear();
    const twins = this.sel ? allCells((m) => m === midiAt(this.sel.s, this.sel.f)) : [];
    allCells().forEach(({ s, f, pc }) => {
      const isSel = this.sel && this.sel.s === s && this.sel.f === f;
      const isTwin = twins.some((t) => t.s === s && t.f === f);
      let visible = this.show === 'all' || (this.show === 'nat' && IS_NATURAL[pc]) || (this.show === 'one' && pc === this.focus) || this.revealed.has(s + ':' + f);
      if (isSel || isTwin) visible = true;
      if (!visible) return;
      Neck.noteMark(s, f, { ring: isSel || isTwin, ringColor: isSel ? '#fff' : noteColor(pc), cls: isTwin && !isSel ? 'pulse' : '', delay: this._stagger ? f * 18 : 0 });
    });
    this._stagger = false;
  },
  onCell(s, f) {
    if (this.view === 'intervals') return IntervalLab.onCell(s, f);
    if (this.view === 'harmonics') return HarmonicLab.onCell(s, f);
    this.sel = { s, f };
    if (this.show === 'none') this.revealed.add(s + ':' + f);
    Neck.play(s, f);
    Voice.say(spoken(midiAt(s, f) % 12));
    this.redraw(); this.renderInfo();
  },
  renderInfo() {
    const box = $('#ex-info', this.p); if (!box) return;
    if (!this.sel) {
      box.innerHTML = `<div><h2>Tap any fret</h2><p>You will hear it, see its name, and see every other spot on the neck that plays the exact same pitch.</p>
      <p style="margin-top:10px">Quiz yourself: choose <b>Blank neck</b>, guess a note in your head, then tap to check.</p></div>`;
      return;
    }
    const { s, f } = this.sel, m = midiAt(s, f), pc = m % 12;
    const twins = allCells((x) => x === m).length - 1;
    box.innerHTML = `<div class="big-note" style="--c:${noteColor(pc)}">${noteName(pc)}</div>
      <div><h2>${esc(noteName(pc))}${octaveOf(m)}</h2>
      <p>${ordinal(stringNumber(s))} string (${noteName(strings()[s] % 12)}), ${f === 0 ? 'played open' : ordinal(f) + ' fret'}</p>
      <div class="facts">
        <div><b>${freqOf(m).toFixed(1)} Hz</b><span>Pitch</span></div>
        <div><b>${twins}</b><span>Other places, same pitch</span></div>
        <div><b>${allCells((x) => x % 12 === pc).length}</b><span>${esc(noteName(pc))}s on this neck</span></div>
      </div></div>`;
  },
  runAll() {
    this.show = 'one'; this.syncChips();
    $$('#ex-show button', this.p).forEach((x) => x.setAttribute('aria-pressed', x.dataset.v === 'one'));
    this._stagger = true; this.redraw();
    const cells = allCells((m) => m % 12 === this.focus).sort((a, b) => a.midi - b.midi || a.s - b.s);
    cells.forEach((c, i) => Neck.play(c.s, c.f, 0.3 + i * 0.32, 0.45));
  },
};

/* ================= Drill config shared by Find + Name ================= */
const Drill = {
  cfg() { return S.settings.drill; },
  selStrings() {
    const n = strings().length; let a = this.cfg().strings;
    if (!Array.isArray(a) || a.length !== n) a = this.cfg().strings = new Array(n).fill(true);
    return a;
  },
  range() {
    const F = S.settings.frets, r = this.cfg().range;
    return r === '0-5' ? [0, 5] : r === '0-12' ? [0, Math.min(12, F)] : r === '5-12' ? [5, Math.min(12, F)] : r === '12+' ? [12, F] : [0, F];
  },
  pool() {
    const [a, b] = this.range(), ss = this.selStrings(), nat = this.cfg().naturals;
    return allCells((m, s, f) => ss[s] && f >= a && f <= b && (!nat || IS_NATURAL[m % 12]));
  },
  inPool(s, f) { return this.pool().some((c) => c.s === s && c.f === f); },
  pick(pool, last) {
    let cand = pool.filter((x) => !last || x.pc !== last.pc || x.s !== last.s);
    if (!cand.length) cand = pool;
    if (!this.cfg().smart) return rand(cand);
    const w = cand.map((x) => {
      const st = cellStat(x.s, x.f); if (!st.n) return 3;
      const acc = st.ok / st.n, avg = st.ok ? st.ms / st.ok : 6000;
      return 0.5 + (1 - acc) * 5 + clamp(avg / 2500, 0, 2.5);
    });
    let r = Math.random() * w.reduce((a, b) => a + b, 0);
    for (let i = 0; i < cand.length; i++) { r -= w[i]; if (r <= 0) return cand[i]; }
    return cand[cand.length - 1];
  },
  html(forFind) {
    const c = this.cfg(), ss = this.selStrings();
    const ranges = [['0-5', 'Open to 5'], ['0-12', 'Open to 12'], ['5-12', '5 to 12']];
    if (S.settings.frets > 12) ranges.push(['12+', `12 to ${S.settings.frets}`]);
    ranges.push(['all', 'Whole neck']);
    const strChips = strings().map((open, s) => ({ s, open })).reverse().map(({ s, open }) =>
      `<button type="button" class="chip" data-s="${s}" aria-pressed="${ss[s]}"><span class="sw" style="background:${noteColor(open % 12)}"></span>${ordinal(stringNumber(s))} <span class="muted">${noteName(open % 12)}</span></button>`).join('');
    return `
      <div class="row"><span class="lbl">Strings</span><div class="wrap" id="dr-strings">${strChips}</div></div>
      <div class="row"><span class="lbl">Frets</span>${seg('dr-range', ranges, c.range)}</div>
      <div class="row"><span class="lbl">Notes</span>${seg('dr-nat', [['1', 'Naturals (A to G)'], ['0', 'All 12 with sharps and flats']], c.naturals ? '1' : '0')}</div>
      ${forFind ? `<div class="row"><span class="lbl">Prompt</span>${seg('dr-kind', [['string', 'Note on one string'], ['all', 'Every spot for a note']], c.kind)}</div>
      <div class="row"><span class="lbl">Answer with</span>${seg('dr-input', [['screen', 'Tap the screen'], ['mic', 'My real guitar (mic)']], c.input)}</div>` : ''}
      <div class="row"><span class="lbl">Options</span><div class="wrap" style="gap:22px">
        <label class="switch"><input type="checkbox" id="dr-smart" ${c.smart ? 'checked' : ''}>Smart order (repeat weak spots)</label>
        ${forFind ? `<label class="switch"><input type="checkbox" id="dr-ps" ${c.promptSound ? 'checked' : ''}>Play the note when asked</label>` : ''}
      </div></div>`;
  },
  wire(p, onChange) {
    const c = this.cfg();
    $('#dr-strings', p).addEventListener('click', (e) => {
      const b = e.target.closest('.chip'); if (!b) return;
      const ss = this.selStrings(); const s = +b.dataset.s;
      if (ss[s] && ss.filter(Boolean).length === 1) { toast('Keep at least one string selected.'); return; }
      ss[s] = !ss[s]; b.setAttribute('aria-pressed', ss[s]); persist(); onChange();
    });
    wireSeg(p, 'dr-range', (v) => { c.range = v; persist(); onChange(); });
    wireSeg(p, 'dr-nat', (v) => { c.naturals = v === '1'; persist(); onChange(); });
    wireSeg(p, 'dr-kind', (v) => { c.kind = v; persist(); onChange(); });
    wireSeg(p, 'dr-input', (v) => { c.input = v; persist(); onChange(); });
    const sm = $('#dr-smart', p); if (sm) sm.addEventListener('change', () => { c.smart = sm.checked; persist(); });
    const ps = $('#dr-ps', p); if (ps) ps.addEventListener('change', () => { c.promptSound = ps.checked; persist(); });
  },
  preview() {
    Neck.clear(); Neck.shade(this.range(), this.selStrings());
    this.pool().forEach(({ s, f, pc }) => Neck.mark(s, f, { color: noteColor(pc), cls: 'small dim', r: 17 }));
  },
  summary(p, round, again, title) {
    const acc = round.total ? Math.round(100 * round.ok / round.total) : 0;
    const avg = round.times.length ? (round.times.reduce((a, b) => a + b, 0) / round.times.length / 1000).toFixed(1) : '–';
    const misses = [...new Set(round.misses)];
    const verdict = acc >= 90 ? 'Superb. Try a wider fret range next.' : acc >= 70 ? 'Solid round. Smart order will keep drilling the misses.' : 'Every miss is now on your practice list. Go again while it is fresh.';
    p.innerHTML = `<div class="surface summary">
      <div class="summary-top">

/* ================= Find the note ================= */
const Find = {
  id: 'find', nav: 'Find it', title: 'Find the note',
  help: 'You get a note and a string. Tap where it lives, or play it on your own guitar. Smart order keeps bringing back the spots you miss.',
  phase: 'setup',

  setup() {

      <div class="row"><span></span><div class="wrap"><button class="btn btn-primary btn-big" id="fd-start">${ICONS.play}Start a ${ROUND}-note round</button>

  },
  async start() {
    const c = Drill.cfg();

    this.round = { i: 0, total: ROUND, ok: 0, streak: 0, best: 0, times: [], misses: [] };
    this.kind = c.input === 'mic' ? 'string' : c.kind;
    if (c.input === 'mic') {

  },
  next() {
    const r = this.round;
    if (r.i >= r.total) return this.finish();
    r.i++;
    const pool = Drill.pool();
    const t = Drill.pick(pool, this.q);
    const need = this.kind === 'all' ? pool.filter((c) => c.pc === t.pc) : pool.filter((c) => c.pc === t.pc && c.s === t.s);
    this.q = Object.assign({}, t, { tries: 0, t0: performance.now(), found: new Set(), need, lastFound: performance.now() });
    this.lock = false;

    Neck.shade(Drill.range(), Drill.selStrings());
    if (this.kind === 'string') {

      Neck.rect(Neck.g.nutX - 92, Neck.g.endX - Neck.g.nutX + 100, { y: y - 16, height: 32, rx: 16, fill: '#ffc857', opacity: 0.2 }, Neck.fxBelow);
    }

  },
  prompt(force) {
    const q = this.q; if (!q || this.phase !== 'play') return;
    if (Drill.cfg().input !== 'mic' && (Drill.cfg().promptSound || force)) Sound.play(q.midi, 0.05);
    const where = this.kind === 'string' ? `on the ${ordinal(stringNumber(q.s))} string` : 'everywhere';

  },
  renderHud() {
    const q = this.q, r = this.round, pc = q.pc;
    const pill = `<span class="note-pill" style="background:${noteColor(pc)};--glow:${noteGlow(pc)}">${noteName(pc)}</span>`;
    const promptTxt = this.kind === 'string'
      ? `Find ${pill} on the ${ordinal(stringNumber(q.s))} string <span class="muted" style="font-weight:500">(${noteName(strings()[q.s] % 12)})</span>`
      : `Find every ${pill} <span class="muted" style="font-weight:500">${q.found.size} of ${q.need.length}</span>`;
    $('#hud').innerHTML = `<div class="prompt">${promptTxt}</div>
      ${Drill.cfg().input === 'mic' ? '<div class="hearing" id="hearing">Hearing <b>–</b></div>' : ''}
      ${hudStats([[`${r.i}/${r.total}`, 'Note'], [r.ok, 'Correct'], [r.streak, 'Streak', r.streak >= 5]])}

  },
  onCell(s, f) {
    if (this.phase !== 'play' || this.lock) { Neck.play(s, f); return; }
    if (Drill.cfg().input === 'mic') { Neck.play(s, f); return; }
    const q = this.q, m = midiAt(s, f), pc = m % 12;
    Neck.play(s, f);
    const hit = q.need.find((c) => c.s === s && c.f === f);
    if (hit && pc === q.pc) {
      if (this.kind === 'string') return this.correct(s, f);
      const k = s + ':' + f; if (q.found.has(k)) return;
      q.found.add(k);
      const now = performance.now(); recordAnswer(s, f, q.tries === 0, now - q.lastFound); q.lastFound = now;
      Neck.noteMark(s, f, { ring: true, cls: 'pulse' });
      if (q.found.size >= q.need.length) this.correct(null, null); else this.renderHud();
    } else this.wrong(s, f, pc);
  },
  correct(s, f) {
    const q = this.q, r = this.round, ms = performance.now() - q.t0;
    if (s != null) { recordAnswer(s, f, q.tries === 0, ms); Neck.noteMark(s, f, { ring: true, cls: 'pulse' }); }
    if (q.tries === 0) { r.ok++; r.streak++; r.best = Math.max(r.best, r.streak); r.times.push(ms); } else r.misses.push(q.pc);
    this.lock = true; this.renderHud();
    if (r.streak && r.streak % 5 === 0) toast(`${r.streak} in a row!`, 1200);
    this.t = setTimeout(() => this.next(), this.kind === 'all' ? 900 : 650);
  },
  wrong(s, f, pc) {
    const q = this.q, r = this.round;
    q.tries++; r.streak = 0;
    Neck.flashBad(s, f, noteName(pc));
    if (q.tries >= 2) {
      this.lock = true; r.misses.push(q.pc);
      q.need.forEach((c) => { if (!q.found.has(c.s + ':' + c.f)) { Neck.noteMark(c.s, c.f, { ring: true, cls: 'pulse target' }); recordAnswer(c.s, c.f, false, 0); } });
      const c0 = q.need[0]; if (c0) setTimeout(() => Neck.play(c0.s, c0.f), 350);
      this.renderHud();
      this.t = setTimeout(() => this.next(), 1800);
    }
  },
  onPitch(freq) {
    const h = $('#hearing b');
    if (freq <= 0 || this.phase !== 'play') { this._stable = 0; return; }
    const midi = Math.round(69 + 12 * Math.log2(freq / 440));
    if (h) { h.textContent = noteName(midi % 12); h.style.color = noteColor(midi % 12); }
    if (midi === this._last) this._stable = (this._stable || 0) + 1; else { this._stable = 1; this._last = midi; }
    if (this._stable === 3 && !this.lock && midi % 12 === this.q.pc) {
      const c = this.q.need.find((x) => x.midi === midi) || this.q.need[0] || this.q;
      Neck.pluck(c.s, c.f); this.correct(c.s, c.f);
    }
  },
  stopMic() { if (Mic.active) Mic.stop(); },
  finish() {
    clearTimeout(this.t); this.stopMic(); this.phase = 'done';
    const r = this.round; r.total = Math.max(1, r.i);
    $('#hud').innerHTML = `<div class="prompt">Round complete</div>`;
    Drill.summary(this.p, r, { play: () => this.start(), setup: () => this.setup() }, `You found ${r.ok} of ${r.total} on the first try.`);
  },
  explain() { return this.phase === 'play' ? false : null; },
  onKey(e) { if (e.code === 'Space' && this.phase === 'play') { e.preventDefault(); this.prompt(true); } },
};

const NameIt = {

    Neck.clear();
    Neck.mark(this.q.s, this.q.f, { label: '?', color: '#f1e9da', cls: 'target pulse', ring: true, ringColor: '#ffc857' });

  },
  renderHud() {
    const r = this.round, q = this.q;
    $('#hud').innerHTML = `<div class="prompt">What note is on the ${ordinal(stringNumber(q.s))} string, ${q.f === 0 ? 'open' : ordinal(q.f) + ' fret'}?</div>
      ${hudStats([[`${r.i}/${r.total}`, 'Note'], [r.ok, 'Correct'], [r.streak, 'Streak', r.streak >= 5]])}
      <div class="round-bar"><i style="width:${100 * (r.i - 1) / r.total}%"></i></div>`;
  },
  answer(pc, btn) {
    if (this.phase !== 'play' || this.lock) return;
    const q = this.q, r = this.round;
    btn = btn || $(`#nm-keys .key[data-pc="${pc}"]`, this.p);
    if (pc === q.pc) {
      const ms = performance.now() - q.t0;
      recordAnswer(q.s, q.f, q.tries === 0, ms);
      if (q.tries === 0) { r.ok++; r.streak++; r.best = Math.max(r.best, r.streak); r.times.push(ms); } else r.misses.push(q.pc);
      if (btn) btn.classList.add('right');
      Neck.noteMark(q.s, q.f, { ring: true, cls: 'pulse' }); Neck.pluck(q.s, q.f);
      Voice.say(spoken(pc));
      this.lock = true; this.renderHud();
      if (r.streak && r.streak % 5 === 0) toast(`${r.streak} in a row!`, 1200);

      if (btn) { btn.classList.add('wrong'); btn.disabled = true; }
      // let the ear compare: play the wrong guess near the real pitch
      const guess = q.midi + ((mod(pc - q.pc + 6, 12)) - 6);
      Sound.play(guess);
      if (q.tries >= 2) {
        r.misses.push(q.pc); recordAnswer(q.s, q.f, false, 0); this.lock = true;
        const right = $(`#nm-keys .key[data-pc="${q.pc}"]`, this.p); if (right) right.classList.add('right');
        Neck.noteMark(q.s, q.f, { ring: true, cls: 'pulse' });

        this.t = setTimeout(() => this.next(), 2100);
      }

  },
  finish() {
    clearTimeout(this.t); this.phase = 'done';

    $('#hud').innerHTML = `<div class="prompt">Round complete</div>`;
    Drill.summary(this.p, r, { play: () => this.start(), setup: () => this.setup() }, `You named ${r.ok} of ${r.total} on the first try.`);
  },
  onCell(s, f) { Neck.play(s, f); },
  explain() { return this.phase === 'play' ? false : null; },
  onKey(e) {
    if (this.phase !== 'play') return;
    if (e.code === 'Space') { e.preventDefault(); Neck.play(this.q.s, this.q.f); return; }
    const map = { a: 9, b: 11, c: 0, d: 2, e: 4, f: 5, g: 7 };

      let pc = map[k];

      this.answer(pc);
    }
  },
};

const MAJOR_STEPS = [0, 2, 4, 5, 7, 9, 11];

const NUMERALS = ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'];

const chordType = (id) => CHORD_TYPES.find((c) => c.id === id) || CHORD_TYPES[0];
function strum(frets, opts = {}) {
  const order = frets.map((f, s) => ({ f, s })).filter((x) => x.f >= 0);
  if (opts.up) order.reverse();
  const gap = opts.arp ? 0.24 : opts.up ? 0.022 : 0.032;
  order.forEach((x, i) => Neck.play(x.s, x.f, (opts.at || 0) + i * gap, (opts.up ? 0.32 : 0.42) * (opts.arp ? 1.25 : 1)));
}
function drawVoicing(v, rootPc, iv, extra = {}) {
  v.frets.forEach((f, s) => {
    if (f < 0) { Neck.mark(s, 0, { label: '×', muted: true, cls: 'muted' }); return; }
    const semi = mod(strings()[s] + f - rootPc, 12);
    const [lab] = intervalInfo(semi, iv);
    Neck.mark(s, f, { label: lab, color: intervalColor(semi, iv), ring: semi === 0, ringColor: '#fff', delay: extra.stagger ? s * 40 : 0 });
  });
}

  mountMap(p) {
    this.p = p;
    p.innerHTML = `<div class="panel-grid">
      <div class="controls">

        </div>

      </div></div>`;
    $('#sc-roots', p).addEventListener('click', (e) => { const b = e.target.closest('.note-chip'); if (!b) return; this.root = +b.dataset.pc; $$('#sc-roots .note-chip', p).forEach((x) => x.setAttribute('aria-pressed', x === b)); this.update(); });
    $('#sc-types', p).addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (!b) return; this.scale = b.dataset.t; $$('#sc-types .chip', p).forEach((x) => x.setAttribute('aria-pressed', x === b)); this.pos = 1; this.update(); });
    $('#sc-play', p).addEventListener('click', () => (this.playing ? this.stop() : this.play()));

    $('#sc-train', p).addEventListener('change', (e) => { this.train = e.target.checked; });

  },
  unmount() { this.stop(); Sound.droneOff(); this.drone = false; },
  positions() {
    const sc = this.sc(), tun = strings(), low = tun[0];
    const pcs = sc.iv.map((i) => mod(this.root + i, 12));
    const anchors = [];
    for (let f = 0; f < 12; f++) if (pcs.includes((low + f) % 12)) anchors.push(f);
    const blue = this.scale === 'blues' ? mod(this.root + 6, 12) : -1;
    const nps = sc.iv.length >= 7 ? 3 : 2;
    return anchors.map((a) => {
      // ascending scale tones from the anchor
      const seq = []; let m = low + a;
      while (seq.length < 60) { if (pcs.includes(m % 12)) seq.push(m); m++; }
      const cells = []; let k = 0;
      for (let s = 0; s < tun.length; s++) {
        let count = 0;
        while (k < seq.length) {
          const mm = seq[k]; const isBlue = mm % 12 === blue;
          const nextOpen = tun[s + 1];
          if (count >= nps && !isBlue && (s === tun.length - 1 || mm >= nextOpen)) break;
          if (mm < tun[s]) { k++; continue; }
          cells.push({ s, f: mm - tun[s], midi: mm }); k++; if (!isBlue) count++;
          if (s === tun.length - 1 && count >= nps) { if (k < seq.length && seq[k] % 12 === blue) { cells.push({ s, f: seq[k] - tun[s], midi: seq[k] }); } break; }
        }
      }
      return { anchor: a, cells: cells.filter((c) => c.f <= S.settings.frets) };

  update() {
    const sc = this.sc();
    $('#sc-name', this.p).innerHTML = `<span style="color:${noteColor(this.root)}">${esc(noteName(this.root))}</span> ${esc(sc.name.toLowerCase())}`;

  draw() {
    Neck.clear();

  },
  play() {
    Sound.ensure();
    const shape = this.shapes[(this.pos || 1) - 1]; if (!shape) return;
    const up = shape.cells.slice().sort((a, b) => a.midi - b.midi || a.s - b.s);
    const seq = up.concat(up.slice(0, -1).reverse());
    const step = 60 / this.bpm / 2; // eighth notes
    seq.forEach((c, i) => Neck.play(c.s, c.f, i * step, 0.5));

      this.stop();
    }, seq.length * step * 1000 + 300);
  },
  stop() {

    const btn = this.p && $('#sc-play', this.p); if (btn) btn.innerHTML = `${ICONS.play}Play this shape`;
  },
  onCell(s, f) { Neck.play(s, f); },
  onKey(e) { if (this.view !== 'map') return; if (e.code === 'Space') { e.preventDefault(); this.playing ? this.stop() : this.play(); } },
};
